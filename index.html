/* ============================================================
   ACCESSIBILITY PREFERENCES
   ============================================================ */
/* A change of appearance eases rather than snaps: a hard dark↔light step
   reads as a flash. The rule lives behind a class that the script keeps for
   140ms, so nothing carries a colour transition for the rest of the session,
   and it sits inside a no-preference query — "reduce motion" gets the
   instantaneous swap without having to know this exists.

   On the duration — this is the whole design of the thing, so it is worth
   writing down. Every continuous palette fade dips through low contrast, and
   no easing shape avoids it: the paper has to travel from #f5f5f7 to #0b0b0d,
   so it must sweep across the luminance the secondary greys sit at (#6e6e73 /
   #8e8e93) and for a beat grey text lands on grey paper. Measured, the trough
   is about 1.2:1 whatever curve or length is chosen; only a zero-length swap
   dodges it, and a zero-length swap *is* the flash this rule exists to avoid.
   So the curve is not the thing to tune — the length is. At 100ms the trough
   fits in one or two frames (~20ms): an ease you can see, with no *sustained*
   moment of unreadable text. At 180ms the same trough is three or four frames
   wide and starts to read as a flicker. Shorter is smoother here, which is the
   whole counter-intuitive point.

   Only chromatic properties are listed. `transform` and `opacity` are left
   out on purpose: they would drag every hover lift and every panel dissolve
   into the palette change, which is motion nobody asked for. The sun/moon
   cross-fade keeps its own transition because .theme-icon is excluded. */
@media (prefers-reduced-motion: no-preference){
  html.theme-swap *:not(.theme-icon),
  html.theme-swap *::before,
  html.theme-swap *::after{
    transition-property:background-color, border-color, color, box-shadow !important;
    transition-duration:var(--dur-swap) !important;
    transition-timing-function:var(--ease-out) !important;
  }
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
    scroll-behavior:auto !important;
  }
  .panel.is-leaving,
  .panel.is-entering{ animation:none !important; }
  .video > a:hover,
  .video > a:hover img,
  .post-back .link:hover,
  .nav a:active,
  .lang button:active,
  .filter-btn:active,
  a.feature:hover{ transform:none; }

  /* keep each arrow in its resting shape; only remove the hover travel */
  a.row:hover::after{ transform:translateY(-50%) rotate(45deg); }
  .row[href].row--external:hover::after{ transform:translateY(-50%); }
  a.feature:hover::after{ transform:translateY(-50%) rotate(45deg); }
  a.feature.feature--external:hover::after{ transform:translateY(-50%); }
  .explore-card:hover::after{ transform:rotate(45deg); }
}

@media (prefers-reduced-transparency: reduce){
  .plate{
    background:var(--bg);
    -webkit-backdrop-filter:none;
    backdrop-filter:none;
  }
}

@media (prefers-contrast: more){
  :root{
    --text-2:var(--text);
    --text-3:#424245;
    --line:rgba(0, 0, 0, .22);
    --line-strong:rgba(0, 0, 0, .42);
  }
  .plate{
    background:var(--bg);
    -webkit-backdrop-filter:none;
    backdrop-filter:none;
  }
  .rows,
  .index,
  .feature,
  .explore-grid,
  .video > a,
  .prose figure img,
  .post-back .link{ border-color:var(--line-strong); }
  .link{ text-decoration-thickness:2px; }
}

/* keyed to the theme in use, not to the system preference: once the reader
   picks an appearance, this has to follow the pick */
@media (prefers-contrast: more){
  :root[data-theme="dark"]{
    --text-3:#d1d1d6;
    --line:rgba(255, 255, 255, .32);
    --line-strong:rgba(255, 255, 255, .52);
  }
}

</style>
</head>

<body>
<a class="skip" href="#main" id="skip">Skip to content</a>

<!-- ============ SIDEBAR ============ -->
<header class="plate">
  <span class="avatar-ring">
    <!-- same idea as the favicon: a real src from the start, so that if /data cannot be
         read (double-clicking the file) the sidebar shows an avatar instead of a broken image -->
    <img class="avatar" id="avatar" src="assets/avatar-youtube.jpg" alt="" width="64" height="64" />
  </span>

  <div class="identity">
    <p class="name" id="profileName"></p>
    <p class="role" id="profileRole"></p>
  </div>

  <nav class="nav" id="nav" aria-label="Sections">
    <ul id="navList"></ul>
  </nav>

  <div class="plate-controls">
    <div class="lang" id="langSwitch" role="group"></div>
    <!-- the label is written by renderSidebar(), which knows the language -->
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark theme">
      <svg class="theme-icon theme-icon--sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="4.25"/>
        <path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.2 5.2l1.55 1.55M17.25 17.25l1.55 1.55M18.8 5.2l-1.55 1.55M6.75 17.25l-1.55 1.55"/>
      </svg>
      <svg class="theme-icon theme-icon--moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/>
      </svg>
    </button>
  </div>

  <p class="plate-foot"><span class="dot" aria-hidden="true"></span><span id="profileStatus"></span></p>
</header>

<!-- ============ CONTENT (rendered from /data) ============ -->
<main class="main" id="main" tabindex="-1"></main>
<!-- route changes are announced, but focus is left where the reader put it -->
<p class="sr-only" id="routeStatus" role="status" aria-live="polite"></p>

<script>
/* ============================================================
   Everything visible is rendered from the JSON files in /data.
   Edit those files to change the site — this script stays as is.

   data/site.json       navigation, languages, page titles
   data/profile.json    avatar, name, tagline, status line
   data/home.json       the Home panel
   data/blog.json       the Blog panel
   data/works.json      the Works & achievements panel
   data/elsewhere.json  the Find me elsewhere panel
   data/posts/*.json    one file per post, fetched the first time it is opened

   A list item that carries a "post" field links to #post/<slug> instead of
   an outside URL, and the post renders in place from its own JSON file.
   ============================================================ */
var STORE_KEY = 'site-lang';

var state = {
  site: null,
  profile: null,
  panels: {},   /* panel id -> json */
  posts: {},    /* slug -> json, filled lazily by showPost() */
  live: null,   /* data/live.json — written by the scheduled sync, may be absent */
  lang: 'en',
  current: '',  /* current route: a panel id, or "post/<slug>" */
  /* which type the works rail is filtered to: '' is everything. Kept out here
     rather than in the markup because a language switch rebuilds every panel
     from scratch, and the reader's choice has to survive that. */
  tag: ''
};

/* ---------- helpers ---------- */
function esc(value) {
  return String(value === null || value === undefined ? '' : value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

/* a value may be a plain string, or { en: …, zh: … }, or rich parts */
function localized(value, lang) {
  if (value === null || value === undefined) { return ''; }
  if (typeof value === 'string' || Array.isArray(value)) { return value; }
  if (typeof value === 'object') {
    if (value[lang] !== undefined) { return value[lang]; }
    var fallback = (state.site && state.site.defaultLanguage) || 'en';
    if (value[fallback] !== undefined) { return value[fallback]; }
    var keys = Object.keys(value);
    return keys.length ? value[keys[0]] : '';
  }
  return String(value);
}

/* rich parts: [ { text }, { text, url }, { text, code }, { text, strong } ] -> escaped html
   A newline becomes <br>, so one paragraph can hold a short stack of lines (a list of
   handles, say) without needing a block type for it. A blank line becomes a wider gap
   (.line-gap), so the same paragraph can still set its lead-in and closing line apart
   from the list in the middle. A line that starts with "-" is a hand-written list line:
   the hyphen becomes a bullet mark rather than sitting against the first letter. */
function withBreaks(html) {
  /* the dash may end this rich part — the link it introduces is the next one */
  return html.replace(/\n-[ \t]*$/g, '\n<span class="list-mark" aria-hidden="true"></span>')
             .replace(/\n[ \t]*\n/g, '<span class="line-gap"></span>')
             .replace(/\n/g, '<br>');
}

function rich(value) {
  if (Array.isArray(value)) {
    return value.map(function (part) {
      if (!part) { return ''; }
      var text = withBreaks(esc(part.text === undefined ? '' : part.text));
      if (part.url) { return '<a class="link" href="' + esc(part.url) + '">' + text + '</a>'; }
      if (part.code) { return '<code>' + text + '</code>'; }
      if (part.strong) { return '<strong>' + text + '</strong>'; }
      return text;
    }).join('');
  }
  return withBreaks(esc(value === undefined || value === null ? '' : value));
}

function field(value) { return rich(localized(value, state.lang)); }
function plain(value) { return esc(localized(value, state.lang)); }

/* Plain text for places that are not markup: document.title, textContent and
   attributes set through the DOM. `plain()` escapes for an HTML string; using
   it there would put a literal "&amp;" in the tab title and the live region. */
function plainText(value) {
  var v = localized(value, state.lang);
  return (v === null || v === undefined) ? '' : String(v);
}

/* Plain text for a rich value: an array of parts becomes the concatenation of
   its text, which keeps a summary usable inside a link without nesting links. */
function summaryText(value) {
  var v = localized(value, state.lang);
  if (Array.isArray(v)) {
    return v.map(function (part) {
      return part && part.text !== undefined ? String(part.text) : '';
    }).join('');
  }
  return (v === null || v === undefined) ? '' : String(v);
}

/* ---------- loading ---------- */
function loadJSON(path) {
  return fetch(path, { cache: 'no-store' }).then(function (res) {
    if (!res.ok) { throw new Error('HTTP ' + res.status); }
    return res.json().then(function (json) { return json; }, function () {
      throw new Error('not valid JSON');
    });
  }, function () {
    throw new Error('could not be loaded');
  });
}

function fail(path, reason) {
  var main = document.getElementById('main');
  var fileHint = path ? '<code>data/' + esc(path) + '</code>' : '';
  main.innerHTML =
    '<div class="panel is-active">' +
      '<h1 class="display">Data could not be loaded / 数据没能读进来</h1>' +
      '<p class="lede">There is a problem with ' + fileHint + ' — ' + esc(reason) + '. ' +
      '检查这个文件里的逗号、引号是否配对。</p>' +
      '<p class="foot">Opening this file straight from your hard drive (file://…) cannot read JSON. ' +
      'Serve the folder over http, for example <code>python3 -m http.server 8000</code>, then visit ' +
      '<code>http://localhost:8000</code>. On GitHub Pages everything works automatically. ' +
      '双击 index.html 直接打开是读不到 JSON 的，需要用上面的本地服务器方式预览；发布到 GitHub Pages 后不受影响。</p>' +
    '</div>';
}

/* ---------- sidebar ---------- */
/* A small, consistent set of line marks for the four known sections. The nav
   itself is data-driven, so an id this file has not met yet still gets a mark
   rather than an empty slot. */
function navIcon(id) {
  var paths = {
    home: '<path d="M3.75 10.5 12 3.75l8.25 6.75"/>' +
          '<path d="M5.75 9.5v9.25A1.75 1.75 0 0 0 7.5 20.5h9a1.75 1.75 0 0 0 1.75-1.75V9.5"/>' +
          '<path d="M9.75 20.5v-5.5h4.5v5.5"/>',
    blog: '<rect x="4.25" y="3.75" width="15.5" height="16.5" rx="3"/>' +
          '<path d="M8 8.5h8M8 12h8M8 15.5h5"/>',
    works: '<path d="M12 3.75l1.65 4.6 4.6 1.65-4.6 1.65L12 16.25l-1.65-4.6-4.6-1.65 4.6-1.65L12 3.75Z"/>' +
           '<path d="M18.5 15.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7.7-1.8Z"/>',
    elsewhere: '<circle cx="12" cy="12" r="8.25"/>' +
               '<path d="M3.75 12h16.5"/>' +
               '<path d="M12 3.75c2.2 2.2 3.4 5.1 3.4 8.25s-1.2 6.05-3.4 8.25c-2.2-2.2-3.4-5.1-3.4-8.25S9.8 5.95 12 3.75Z"/>'
  };
  var path = paths[id] || '<circle cx="12" cy="12" r="3.25"/>';
  return '<svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
         'stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" ' +
         'aria-hidden="true" focusable="false">' + path + '</svg>';
}

/* ---------- appearance ----------
   The palette is in CSS; this only decides which one is on. `data-theme` is
   the single writer, so a system change and a reader's choice can never both
   claim the page. The stored value is checked first and the system is the
   fallback — that ordering *is* the priority rule, in one line. */
var THEME_KEY = 'site-theme';
var systemAppearance = window.matchMedia('(prefers-color-scheme: dark)');
var swapTimer = null;

function storedTheme() {
  try {
    var v = localStorage.getItem(THEME_KEY);
    return (v === 'light' || v === 'dark') ? v : '';
  } catch (e) { return ''; }
}

function currentTheme() {
  return document.documentElement.getAttribute('data-theme') ||
         (systemAppearance.matches ? 'dark' : 'light');
}

/* The label names the move, the icon shows where it leads, so a screen reader
   and the picture agree. Both follow the current language. */
function paintTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);

  var meta = document.getElementById('themeColor');
  if (meta) { meta.setAttribute('content', theme === 'dark' ? '#0b0b0d' : '#f5f5f7'); }

  var btn = document.getElementById('themeToggle');
  if (!btn) { return; }
  var words = (state.site && state.site.themeToggle) || {};
  var fallback = theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme';
  btn.setAttribute('aria-label', plainText(words[theme === 'dark' ? 'toLight' : 'toDark'] || fallback));
}

function setTheme(theme, instant) {
  var root = document.documentElement;

  /* The palette cross-fades over --dur-swap; the class outlives it by a
     margin so the tail of that transition is not cut off. Leaving the class
     on would make every later hover transition colours it never meant to. */
  if (!instant && canAnimate()) {
    root.classList.add('theme-swap');
    if (swapTimer) { window.clearTimeout(swapTimer); }
    swapTimer = window.setTimeout(function () {
      root.classList.remove('theme-swap');
      swapTimer = null;
    }, 140);
  } else {
    root.classList.remove('theme-swap');
  }

  paintTheme(theme);
}

function toggleTheme() {
  var next = currentTheme() === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
  setTheme(next);
}

/* The system is a default, not an override: once the reader has picked an
   appearance, later changes to the OS setting leave their choice alone. */
systemAppearance.addEventListener('change', function (e) {
  if (storedTheme()) { return; }
  setTheme(e.matches ? 'dark' : 'light');
});

document.getElementById('themeToggle').addEventListener('click', toggleTheme);

function renderSidebar() {
  var profile = state.profile || {};
  var avatar = profile.avatar || {};

  var img = document.getElementById('avatar');
  if (avatar.src) { img.src = avatar.src; }
  img.alt = plainText(avatar.alt);

  document.getElementById('profileName').textContent = plainText(profile.name);
  document.getElementById('profileRole').innerHTML = field(profile.role);
  document.getElementById('profileStatus').innerHTML = field(profile.status);
  document.getElementById('skip').textContent = plainText(state.site.skipLink);

  if (avatar.src) { document.getElementById('favicon').href = profile.favicon || avatar.src; }
  document.getElementById('metaDescription').content = plainText(state.site.metaDescription);

  document.documentElement.lang = (state.lang === 'zh') ? 'zh-CN' : 'en';
  document.getElementById('nav').setAttribute('aria-label',
    state.lang === 'zh' ? '页面导航' : 'Sections');

  /* nav */
  document.getElementById('navList').innerHTML = (state.site.nav || []).map(function (item) {
    return '<li><a href="#' + esc(item.id) + '" data-nav="' + esc(item.id) + '">' +
           navIcon(item.id) +
           '<span class="nav-label">' + field(item.label) + '</span></a></li>';
  }).join('');

  /* language switch — a segmented control. The slash span stays in the markup
     for the old two-word treatment, but the stylesheet hides it. */
  var group = document.getElementById('langSwitch');
  group.setAttribute('aria-label', plainText(state.site.languageGroupLabel));
  group.innerHTML = (state.site.languages || []).map(function (lang, i) {
    return (i ? '<span class="lang-sep" aria-hidden="true">/</span>' : '') +
           '<button type="button" data-lang="' + esc(lang.code) + '" lang="' +
           esc(lang.code === 'zh' ? 'zh-CN' : lang.code) + '" aria-pressed="' +
           (lang.code === state.lang ? 'true' : 'false') + '">' + esc(lang.label) + '</button>';
  }).join('');
  Array.prototype.forEach.call(group.querySelectorAll('button'), function (b) {
    b.addEventListener('click', function () {
      var code = b.getAttribute('data-lang');
      if (code === state.lang) { return; }
      state.lang = code;
      try { localStorage.setItem(STORE_KEY, code); } catch (err) {}
      render();
      /* the header was rebuilt, so the button that had focus is gone. Put
         focus back on the same choice in the new markup, for keyboard,
         assistive-tech and pointer activation alike. */
      var next = group.querySelector('button[data-lang="' + code + '"]');
      if (next) { next.focus({ preventScroll: true }); }
    });
  });

  /* the switch's label is prose, so it has to be re-written when the
     language changes — the theme itself does not change with it */
  paintTheme(currentTheme());
}

/* ---------- panels ---------- */
/* ---------- the "latest video" slot ----------
   Three states, in this order of priority:

     1. video.bvid is filled in         -> Bilibili's own player, embedded.
                                           Filling in one BV id is the only
                                           manual step the site asks for.
     2. data/live.json has an upload    -> its cover, title and link. All three
                                           are written together by
                                           tools/sync_latest.py, so the picture
                                           and the caption cannot drift apart.
     3. neither                         -> the hand-written video.image / .url
                                           / .linkText, i.e. the old behaviour.

   The browser never calls YouTube or Bilibili itself: neither sends CORS
   headers (and Bilibili answers 412 to anything it doesn't like), so the
   fetching happens outside the page, in a scheduled job.
   ============================================ */
function videoFigure(video) {
  if (!video || !video.enabled) { return ''; }

  var live = (state.live && state.live.youtube) || null;
  var suffix = rich(localized(video.suffix, state.lang));

  /* 1 — a BV id means she wants the Bilibili player in the frame */
  if (video.bvid) {
    var watch = 'https://www.bilibili.com/video/' + video.bvid;
    var also = '';
    if (live && live.url) {
      also = '<span class="video-more">' + field(video.autoLabel) +
               '<a class="link" href="' + esc(live.url) + '">' + esc(live.title) + '</a>' +
             '</span>';
    }
    return '<figure class="video">' +
             '<iframe class="video-embed" src="https://player.bilibili.com/player.html?bvid=' +
               esc(video.bvid) + '&amp;page=1&amp;high_quality=1&amp;danmaku=0&amp;autoplay=0"' +
               ' title="' + plain(video.alt) + '" loading="lazy"' +
               ' scrolling="no" frameborder="0" allowfullscreen="true"></iframe>' +
             '<figcaption><a class="link" href="' + esc(watch) + '">' +
               field(video.watchLabel) + '</a>' + also + '</figcaption>' +
           '</figure>';
  }

  /* 2 + 3 — a cover picture; the auto one only when the sync has run */
  var cover = video.image || (live ? 'assets/auto-latest.jpg' : '');
  if (!cover) { return ''; }

  var url = (live && live.url) || video.url || '';
  var caption = (live && live.title) || video.linkText || '';
  var img = '<img src="' + esc(cover) + '" alt="' + plain(video.alt) + '" />';

  return '<figure class="video">' +
           (url ? '<a href="' + esc(url) + '">' + img + '</a>' : img) +
           (caption
             ? '<figcaption><a class="link" href="' + esc(url || '#') + '">' +
                 esc(caption) + '</a>' + suffix + '</figcaption>'
             : '') +
         '</figure>';
}

/* The home page ends with data-driven ways into the other panels. Labels come
   from site.nav and descriptions from each panel's existing lede, so nothing
   extra needs to be added to an old config for this block to work. */
function renderExplore(currentId) {
  var items = (state.site.nav || []).filter(function (item) {
    return item.id !== currentId && state.panels[item.id];
  });
  if (!items.length) { return ''; }

  var label = state.lang === 'zh' ? '探索更多' : 'Explore more';
  var tiles = items.map(function (item) {
    var panel = state.panels[item.id];
    var summary = summaryText(panel.lede).replace(/\s+/g, ' ').trim();
    return '<a class="explore-card" href="#' + esc(item.id) + '">' +
             '<span class="explore-icon" aria-hidden="true">' + navIcon(item.id) + '</span>' +
             '<span class="explore-body">' +
               '<span class="explore-title">' + field(item.label) + '</span>' +
               (summary ? '<span class="explore-desc">' + esc(summary) + '</span>' : '') +
             '</span>' +
           '</a>';
  }).join('');

  return '<nav class="explore" aria-labelledby="home-explore-title">' +
           '<h2 class="section-title" id="home-explore-title">' + esc(label) + '</h2>' +
           '<div class="explore-grid">' + tiles + '</div>' +
         '</nav>';
}

/* Four channels, one line each. The service is the label, the account is the
   name, the handle is the reference — three registers of the same fact, which
   is why they read as a row instead of a sentence. All of it comes from
   data/home.json; nothing here is written into the markup. */
function renderChannels(block) {
  var items = (block && block.items) || [];
  if (!items.length) { return ''; }

  var html = '<div class="channels">';
  if (block.label) {
    html += '<p class="channels-lead">' + field(block.label) + '</p>';
  }
  html += '<ul class="channels-list">' + items.map(function (item) {
    /* an entry without a url is still worth listing, it just is not a link */
    var tag = item.url ? 'a' : 'div';
    var link = item.url ? ' href="' + esc(item.url) + '"' : '';
    return '<li><' + tag + ' class="channel"' + link + '>' +
             '<span class="channel-platform">' + field(item.platform) + '</span>' +
             '<span class="channel-account">' + field(item.account) + '</span>' +
             (item.handle ? '<span class="channel-handle">' + field(item.handle) + '</span>' : '') +
           '</' + tag + '></li>';
  }).join('') + '</ul>';
  if (block.summary) {
    html += '<p class="channels-summary">' + field(block.summary) + '</p>';
  }
  return html + '</div>';
}

/* The open-source note is a footnote to the page, so it gets its own labelled
   block rather than a fifth row in the list above. */
function renderSource(block) {
  if (!block || !block.url) { return ''; }
  var html = '<aside class="source">';
  if (block.label) { html += '<p class="source-label">' + field(block.label) + '</p>'; }
  if (block.text) { html += '<p class="source-text">' + field(block.text) + '</p>'; }
  html += '<a class="link source-url" href="' + esc(block.url) + '">' + plain(block.url) + '</a>';
  return html + '</aside>';
}

function renderHome(id, data) {
  var html = '<h1 class="display" id="' + esc(id) + '-title">' + field(data.heading) + '</h1>';
  html += '<p class="lede">' + field(data.lede) + '</p>';

  /* Two shapes are understood: the structured one home.json carries now, and
     the plain paragraph list that older copies of the file use. The old one
     still renders exactly as it always did — no migration required. */
  if (data.channels) {
    html += renderChannels(data.channels);
    html += renderSource(data.openSource);
  } else {
    (data.paragraphs || []).forEach(function (para) {
      html += '<p>' + field(para) + '</p>';
    });
  }

  var videoHtml = videoFigure(data.video);

  /* the latest video leads the "Lately" group, so the thumbnail sits under a
     heading instead of floating between the prose and the next section */
  var lately = data.lately;
  if (lately && (lately.items || []).length) {
    html += '<h2 class="section-title">' + field(lately.title) + '</h2>';
    html += videoHtml;
    html += '<dl class="index">';
    (lately.items).forEach(function (item) {
      html += '<div><dt>' + field(item.label) + '</dt><dd>' + field(item.value) + '</dd></div>';
    });
    html += '</dl>';
  } else {
    html += videoHtml;
  }

  html += renderExplore(id);

  /* no footnote here — renderPanels() appends it once for every layout */
  return html;
}

function renderRows(items) {
  if (!items || !items.length) { return ''; }
  return '<ul class="rows">' + items.map(function (item) {
    /* A row names two things: where it is, and who I am there. They used to be
       one string joined by a dash — "Bilibili — 澄闪大猫猫" — which made the
       reader parse a sentence to find the account, and read as prose in a list
       that is really a table. Split in two, the platform becomes the label and
       the account the line you scan for: the same hierarchy the home panel's
       channel table already uses. Blog rows have no platform and keep the
       single title. */
    var main = '<span class="row-main">';
    if (item.platform) {
      main += '<p class="row-platform">' + field(item.platform) + '</p>';
      if (item.account) { main += '<h2 class="row-title">' + field(item.account) + '</h2>'; }
    }
    else { main += '<h2 class="row-title">' + field(item.title) + '</h2>'; }
    main += '<p class="row-note">' + field(item.note) + '</p></span>';
    var inner = main;
    if (item.meta) { inner += '<span class="row-meta">' + field(item.meta) + '</span>'; }

    /* "post" opens a page inside the site; "url" sends the reader away */
    var href = item.post ? '#post/' + item.post : (item.url || '');
    var external = !item.post && !!item.url;
    var cls = external ? 'row row--external' : 'row';
    return '<li>' +
      (href ? '<a class="' + cls + '" href="' + esc(href) + '">' + inner + '</a>'
            : '<div class="row">' + inner + '</div>') +
      '</li>';
  }).join('') + '</ul>';
}

/* A list whose entries open in-site posts is an article index, not a directory.
   The first entry gets a featured treatment and the rest keep the compact row
   list. The shape of the existing items decides this — no new config field is
   required, so older list configs keep working unchanged. */
function renderArticleList(items) {
  if (!items || !items.length) { return ''; }
  var first = items[0];
  var href = first.post ? '#post/' + first.post : (first.url || '');
  var external = !first.post && !!first.url;
  var cls = external ? 'feature feature--external' : 'feature';
  var meta = first.meta ? '<p class="feature-meta">' + field(first.meta) + '</p>' : '';
  var note = first.note ? '<p class="feature-note">' + field(first.note) + '</p>' : '';
  var body = '<div class="feature-body">' +
               '<h2 class="feature-title">' + field(first.title) + '</h2>' +
               meta +
               note +
             '</div>';
  var feature = href
    ? '<a class="' + cls + '" href="' + esc(href) + '">' + body + '</a>'
    : '<div class="feature">' + body + '</div>';
  var rest = items.slice(1);
  return feature + (rest.length ? '<div class="article-list">' + renderRows(rest) + '</div>' : '');
}

/* The types a page actually carries, in the order the data first mentions them.
   Read off the entries every time rather than kept as a list of its own: adding
   a type to one entry is then all it takes for the filter above the rail and the
   tags below it to pick it up, and no type can go stale in three places at once. */
function tagSet(data) {
  var map = (data && data.tagLabels) || {};
  var seen = {}, out = [];
  ((data && data.items) || []).forEach(function (item) {
    var keys = (item && item.tags) || [];
    if (typeof keys === 'string') { keys = [keys]; }
    keys.forEach(function (key) {
      if (seen[key]) { return; }
      seen[key] = true;
      /* an unknown key still shows, as itself, rather than vanishing silently */
      out.push({ key: key, label: map[key] === undefined ? { en: key, zh: key } : map[key] });
    });
  });
  return out;
}

/* the filter, on the line under the lede: one button per type the data carries,
   and one way back to everything. Buttons rather than links, because which
   entries are on screen is a state of this page and not a place to be sent to.
   A single type is not a choice, so then there is no filter at all. */
function renderFilter(data) {
  var tags = tagSet(data);
  if (tags.length < 2) { return ''; }
  function button(key, label) {
    return '<button type="button" class="filter-btn" data-tag="' + esc(key) + '"' +
           ' aria-pressed="' + (key === state.tag ? 'true' : 'false') + '">' +
           field(label) + '</button>';
  }
  var html = button('', { en: 'All', zh: '全部' });
  tags.forEach(function (t) { html += button(t.key, t.label); });
  return '<div class="filter" role="group" aria-label="' +
         plain(data.filterLabel || 'Filter') + '">' + html + '</div>';
}

/* the tags the page is filed under, under the rail and on the rail's edge */
function renderTagList(data) {
  var tags = tagSet(data);
  if (!tags.length) { return ''; }
  return '<p class="taglist">' +
           '<span class="taglist-label">' + field(data.tagsLabel || 'Tags') + '</span>' +
           tags.map(function (t) { return '<span class="tag">' + field(t.label) + '</span>'; }).join('') +
         '</p>';
}

/* works & achievements: a dated rail. Each entry is a dated point on one
   continuous rule, with the card hung off it on the right. Newest first — the
   data decides the order, this only draws it.

   Two labels can ride on an entry, both at the far end of the title line and
   neither of them invented here: `kind` is the hand-written word for whether an
   entry is a work or an achievement, and `tags` are keys into data.tagLabels —
   the same keys the filter and the tag list are built from, so an entry and the
   page's own filing can never drift apart. */
function renderTimeline(data) {
  var items = (data && data.items) || [];
  if (!items.length) { return ''; }
  var map = (data && data.tagLabels) || {};
  return '<ol class="timeline">' + items.map(function (item) {
    var title = field(item.title);
    if (item.url) { title = '<a class="link tl-link" href="' + esc(item.url) + '">' + title + '</a>'; }
    var keys = item.tags || [];
    if (typeof keys === 'string') { keys = [keys]; }
    var plates = keys.map(function (key) {
      var label = map[key] === undefined ? { en: key, zh: key } : map[key];
      return '<span class="tl-tag">' + field(label) + '</span>';
    }).join('');
    /* tags and kind share one right-aligned tail, so a card with both never
       spreads them across the title line */
    var tail = (plates || item.kind)
      ? '<span class="tl-tail">' +
          (plates ? '<span class="tl-tags">' + plates + '</span>' : '') +
          (item.kind ? '<span class="tl-kind">' + field(item.kind) + '</span>' : '') +
        '</span>'
      : '';
    return '<li class="tl-item"' +
      (keys.length ? ' data-tags="' + esc(keys.join(' ')) + '"' : '') + '>' +
      '<span class="tl-date">' + field(item.date) + '</span>' +
      '<span class="tl-node" aria-hidden="true"></span>' +
      '<div class="tl-card">' +
        '<div class="tl-head">' +
          '<h2 class="tl-title">' + title + '</h2>' +
          tail +
        '</div>' +
        '<p class="tl-note">' + field(item.note) + '</p>' +
      '</div>' +
    '</li>';
  }).join('') + '</ol>';
}

/* ---------- posts ----------
   A post is one file: data/posts/<slug>.json. Its body is a list of blocks,
   and the single key of each block decides the element, so writing a post
   stays data work rather than markup work:

     { "p": … }          a paragraph
     { "h2": … }         a sub-heading          { "h3": … } a smaller one
     { "ul": [ … ] }     a bulleted list        { "ol": [ … ] } a numbered one
     { "quote": … }      a pull quote
     { "code": "…" }     a preformatted block (same in both languages)
     { "img": { "src": …, "alt": …, "caption": … } }

   Every text value may be a plain string, { "en": …, "zh": … }, or the rich
   parts array the rest of the site uses for links inside a sentence.
   Rich parts are [ { text }, { text, url }, { text, code }, { text, strong } ]. */
function renderBlocks(body) {
  if (!Array.isArray(body)) { return ''; }
  return body.map(function (block) {
    if (!block) { return ''; }
    if (block.p !== undefined)     { return '<p>' + field(block.p) + '</p>'; }
    if (block.h2 !== undefined)    { return '<h2>' + field(block.h2) + '</h2>'; }
    if (block.h3 !== undefined)    { return '<h3>' + field(block.h3) + '</h3>'; }
    if (block.quote !== undefined) { return '<blockquote>' + field(block.quote) + '</blockquote>'; }
    if (block.code !== undefined)  { return '<pre><code>' + plain(block.code) + '</code></pre>'; }
    if (block.ul !== undefined)    { return '<ul>' + listItems(block.ul) + '</ul>'; }
    if (block.ol !== undefined)    { return '<ol>' + listItems(block.ol) + '</ol>'; }
    if (block.img !== undefined)   { return postFigure(block.img); }
    return '';
  }).join('');
}

function listItems(items) {
  if (!Array.isArray(items)) { return ''; }
  return items.map(function (item) { return '<li>' + field(item) + '</li>'; }).join('');
}

function postFigure(img) {
  if (!img || !img.src) { return ''; }
  return '<figure>' +
           '<img src="' + esc(img.src) + '" alt="' + plain(img.alt) + '" />' +
           (img.caption ? '<figcaption>' + field(img.caption) + '</figcaption>' : '') +
         '</figure>';
}

/* Which panel's list does this slug belong to? Gives the way back and decides
   which nav item stays highlighted while reading. */
function postOwner(slug) {
  var owner = '';
  Object.keys(state.panels).forEach(function (id) {
    var items = (state.panels[id] && state.panels[id].items) || [];
    items.forEach(function (item) { if (item && item.post === slug) { owner = id; } });
  });
  return owner;
}

function renderPost(post, owner) {
  var label = '';
  (state.site.nav || []).forEach(function (item) { if (item.id === owner) { label = item.label; } });

  var html = '<p class="post-back"><a class="link" href="#' + esc(owner) + '">← ' +
             field(label) + '</a></p>';
  html += '<h1 class="display" id="post-title">' + field(post.title) + '</h1>';
  if (post.date) { html += '<p class="post-meta">' + esc(post.date) + '</p>'; }
  if (post.lede) { html += '<p class="lede">' + field(post.lede) + '</p>'; }
  html += '<div class="prose">' + renderBlocks(post.body) + '</div>';
  if (post.footnote) { html += '<p class="foot">' + field(post.footnote) + '</p>'; }
  return html;
}

function renderPanels() {
  var main = document.getElementById('main');
  main.innerHTML = '';

  (state.site.nav || []).forEach(function (item) {
    var data = state.panels[item.id];
    if (!data) { return; }

    var heading = '<h1 class="display" id="' + esc(item.id) + '-title">' + field(data.heading) + '</h1>' +
                  '<p class="lede">' + field(data.lede) + '</p>';

    /* one branch per layout in data/site.json — written out rather than
       defaulted, so the set of layouts this file understands is greppable
       (the data audit reads these names instead of keeping its own copy) */
    var body = '';
    if (item.layout === 'home') { body = renderHome(item.id, data); }
    else if (item.layout === 'list') {
      /* A list that opens in-site posts is an article index; a list of outbound
         links is a directory. The item shape decides, so both old configs keep
         the same layout name and the same fields. */
      var entries = data.items || [];
      var hasPosts = entries.some(function (entry) { return entry && entry.post; });
      body = heading + (hasPosts ? renderArticleList(entries) : renderRows(entries));
    }
    else if (item.layout === 'timeline') {
      /* filter, then the rail, then the tags the rail is filed under — the
         control above the thing it rules, the legend below it */
      body = heading + renderFilter(data) + renderTimeline(data) + renderTagList(data);
    }
    else { body = heading + renderRows(data.items); }   /* unknown: show the rows */
    if (data.footnote) { body += '<p class="foot">' + field(data.footnote) + '</p>'; }

    var section = document.createElement('section');
    section.className = 'panel';
    section.id = item.id;
    section.setAttribute('aria-labelledby', item.id + '-title');
    section.innerHTML = body;
    section.hidden = true;
    main.appendChild(section);
  });

  applyTagFilter();
}

/* ---------- the type filter ----------
   Which entries are on screen is written onto the rows themselves, and the
   buttons are re-stamped to match, so the markup is always the whole truth:
   a screen reader and the next language switch both see
   the filtered state rather than having to ask this script for it. */
function applyTagFilter() {
  Array.prototype.forEach.call(document.querySelectorAll('#main > .panel'), function (panel) {
    Array.prototype.forEach.call(panel.querySelectorAll('.tl-item'), function (li) {
      var keys = (li.getAttribute('data-tags') || '').split(' ');
      li.hidden = !!state.tag && keys.indexOf(state.tag) < 0;
    });
    Array.prototype.forEach.call(panel.querySelectorAll('.filter-btn'), function (b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-tag') === state.tag ? 'true' : 'false');
    });
  });
}

/* one listener for every filter on the page rather than one per button: the
   panels are rebuilt on a language switch, and listeners bound to them would be
   swept away with the markup they were bound to */
document.addEventListener('click', function (e) {
  var btn = e.target && e.target.closest ? e.target.closest('.filter-btn') : null;
  if (!btn) { return; }
  state.tag = btn.getAttribute('data-tag') || '';
  applyTagFilter();
});

/* A link inside the content that changes the route will hide the panel that
   had focus before the hashchange event fires. Note the click in the capture
   phase, before any header or content handler, so revealPanel knows whether
   focus should follow the new heading. Any other click clears the note. */
var contentNavAt = 0;
document.addEventListener('click', function (e) {
  var link = e.target && e.target.closest ? e.target.closest('#main a[href^="#"]') : null;
  contentNavAt = link ? Date.now() : 0;
}, true);

/* ---------- section switching ---------- */
function highlightNav(navId) {
  Array.prototype.forEach.call(document.querySelectorAll('.nav a[data-nav]'), function (a) {
    if (a.getAttribute('data-nav') === navId) { a.setAttribute('aria-current', 'page'); }
    else { a.removeAttribute('aria-current'); }
  });
}

/* Route changes are announced politely for screen-reader users. Focus is not
   moved, so the keyboard position stays where the reader put it. */
function announceRoute(label) {
  var el = document.getElementById('routeStatus');
  if (el) { el.textContent = label || ''; }
}

/* On the masthead layout the nav is a horizontal scroller. Bring the current
   section into view when it is not already visible, without moving the page,
   and tell the stylesheet which edges still have destinations beyond them so
   only those edges fade. */
function updateNavEdges() {
  var list = document.querySelector('.nav ul');
  if (!list) { return; }
  var scrollable = list.scrollWidth > list.clientWidth + 1;
  list.classList.toggle('is-scrollable', scrollable);
  list.classList.toggle('at-start', list.scrollLeft <= 1);
  list.classList.toggle('at-end',
    list.scrollLeft + list.clientWidth >= list.scrollWidth - 1);
}

function revealActiveNav() {
  var list = document.querySelector('.nav ul');
  if (!list) { return; }
  updateNavEdges();
  var active = list.querySelector('a[aria-current="page"]');
  if (!list.classList.contains('is-scrollable') || !active) { return; }

  var listRect = list.getBoundingClientRect();
  var activeRect = active.getBoundingClientRect();
  if (activeRect.left >= listRect.left && activeRect.right <= listRect.right) { return; }

  var left = list.scrollLeft + (activeRect.left - listRect.left) -
             (listRect.width - activeRect.width) / 2;
  list.scrollTo({
    left: Math.max(0, left),
    behavior: canAnimate() ? 'smooth' : 'auto'
  });
}

var navMeasureFrame = null;
window.addEventListener('resize', function () {
  if (navMeasureFrame) { window.cancelAnimationFrame(navMeasureFrame); }
  navMeasureFrame = window.requestAnimationFrame(revealActiveNav);
});

/* The nav list element survives every render (only its innerHTML is replaced),
   so one listener here covers the page's whole life. */
var navScroller = document.getElementById('navList');
if (navScroller) {
  navScroller.addEventListener('scroll', updateNavEdges, { passive:true });
}

/* ---------- what is on screen ----------
   A change of panel is a two-step move: the panel on screen dips to a faint
   trace, and the incoming one is set in its place, rising back to full strength.
   Two steps rather than a cross-dissolve because the panels sit in the normal
   flow (they are different heights, so they have to) and two sets of text
   faded through each other would double-expose. The phases meet at --dip
   (12% opacity), where neither state is legible and neither is missing, so the
   handover is invisible and the move reads as one continuous settle.

   Three cases go straight to the last step, because none of them is a jump:
   the first paint; a language re-render, which rebuilds every panel and so
   leaves nothing on screen marked active; and a reader who has asked the system
   for less motion. The out duration is mirrored by .panel.is-leaving in the
   stylesheet — change both together. */
var LEAVE_MS = 140;
var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
var leaveTimer = null;    /* the handoff queued behind a panel that is lifting off */
var pendingShow = null;   /* {panel, write} waiting on that handoff */

function canAnimate() { return !(reducedMotion && reducedMotion.matches); }

function mainPanels() {
  return Array.prototype.slice.call(document.querySelectorAll('#main > .panel'));
}

/* the one panel currently on screen, if any */
function panelOnScreen() {
  var found = null;
  mainPanels().forEach(function (p) {
    if (p.classList.contains('is-active')) { found = p; }
  });
  return found;
}

/* whatever was lifting off is not going anywhere any more */
function forgetHandoff() {
  pendingShow = null;
  if (leaveTimer) { window.clearTimeout(leaveTimer); leaveTimer = null; }
}

/* put one panel on screen and hide the rest, with no move at all */
function showOnly(panel) {
  forgetHandoff();
  mainPanels().forEach(function (p) {
    p.classList.remove('is-leaving', 'is-entering');
    var on = (p === panel);
    p.classList.toggle('is-active', on);
    p.hidden = !on;
  });
}

/* When navigation starts inside the content (a row, the post back link), focus
   would otherwise be left on an element that is now hidden. Move it to the new
   panel's heading; nav and language controls outside the panel keep their own
   focus. The heading is not interactive, so its outline is suppressed in CSS. */
function focusPanelHeading(panel) {
  if (!panel) { return; }
  var heading = panel.querySelector('h1');
  if (!heading) { return; }
  heading.setAttribute('tabindex', '-1');
  heading.focus({ preventScroll: true });
}

/* One place decides what is on screen, so a post and a panel cannot both show.
   `write`, when given, fills the panel in — it is held back to the moment the
   panel is shown, which is what makes one post to the next a real move even
   though both of them are the same element. */
function revealPanel(panel, navId, write) {
  var onScreen = panelOnScreen();
  var fromContentLink = (Date.now() - contentNavAt) < 5000;
  var focusWasInside = fromContentLink || !!(onScreen && onScreen.contains(document.activeElement));
  if (fromContentLink) { contentNavAt = 0; }
  highlightNav(navId);
  window.scrollTo(0, 0);
  window.requestAnimationFrame(revealActiveNav);

  /* the same element simply re-read (a language re-render of one post) is not a
     change of panel either */
  if (!canAnimate() || !onScreen || (onScreen === panel && !write)) {
    if (write) { write(); }
    showOnly(panel);
    if (focusWasInside) { focusPanelHeading(panel); }
    return;
  }

  /* a second click while the first panel is still lifting off: re-aim, don't
     restart, so the outgoing panel never flashes back to full strength */
  pendingShow = { panel: panel, write: write, focus: focusWasInside };
  if (onScreen.classList.contains('is-leaving')) { return; }

  onScreen.classList.remove('is-entering');
  onScreen.classList.add('is-leaving');
  onScreen.hidden = false;
  leaveTimer = window.setTimeout(land, LEAVE_MS);
}

/* the incoming panel takes over */
function land() {
  leaveTimer = null;
  var job = pendingShow;
  pendingShow = null;
  /* the tree can be rebuilt underneath us (a language re-render) while we wait */
  if (!job || !job.panel.parentNode) { return; }

  if (job.write) { job.write(); }

  mainPanels().forEach(function (p) {
    p.classList.remove('is-leaving');
    var on = (p === job.panel);
    p.classList.toggle('is-active', on);
    p.hidden = !on;
  });

  void job.panel.offsetWidth;             /* flush the display change … */
  job.panel.classList.add('is-entering'); /* … so the panel rises from the dip */
  if (job.focus) { focusPanelHeading(job.panel); }
}

/* The enter class takes itself off when its animation ends — one listener for
   the whole page, so its duration is never mirrored in the script too. */
document.addEventListener('animationend', function (e) {
  var t = e.target;
  if (t && t.classList && t.classList.contains('is-entering')) {
    t.classList.remove('is-entering');
  }
});

function showPanel(requested) {
  var panels = Array.prototype.slice.call(document.querySelectorAll('.panel'));
  if (!panels.some(function (p) { return p.id === requested; })) { requested = 'home'; }
  if (!document.getElementById(requested)) {
    requested = panels.length ? panels[0].id : '';
  }
  state.current = requested;
  revealPanel(document.getElementById(requested), requested);

  var current = (state.site.nav || []).filter(function (n) { return n.id === requested; })[0];
  document.title = current ? plainText(current.title) : '';
  announceRoute(current ? plainText(current.label) : '');
}

/* A post is fetched the first time it is opened and then kept, so switching
   language re-renders from the cached file and stays instant. */
function showPost(slug) {
  state.current = 'post/' + slug;

  var nav = state.site.nav || [];
  var owner = postOwner(slug) || (nav[0] && nav[0].id) || 'home';

  var paint = function (post) {
    var main = document.getElementById('main');
    var section = document.getElementById('post-panel');
    if (!section) {
      section = document.createElement('section');
      section.className = 'panel';
      section.id = 'post-panel';
      section.setAttribute('aria-labelledby', 'post-title');
      main.appendChild(section);
    }
    var html = renderPost(post, owner);
    document.title = plainText(post.title) + ' — ' + plainText((state.profile || {}).name || '');
    announceRoute(plainText(post.title));
    /* the markup is handed over rather than pasted in: when this post replaces
       another in the very same element, the old words have to stay up until the
       panel has lifted off */
    revealPanel(section, owner, function () { section.innerHTML = html; });
  };

  if (state.posts[slug]) { paint(state.posts[slug]); return; }
  loadJSON('data/posts/' + slug + '.json').then(function (post) {
    state.posts[slug] = post;
    /* the reader may have clicked away while this was in flight */
    if (state.current === 'post/' + slug) { paint(post); }
  }).catch(function (e) {
    fail('posts/' + slug + '.json', e.message);
  });
}

function routeFromHash() {
  return (location.hash || '').replace(/^#/, '');
}

function applyRoute(route) {
  var post = /^post\/(.+)$/.exec(route || '');
  if (post) { showPost(decodeURIComponent(post[1])); return; }
  showPanel(route);
}

function render() {
  renderSidebar();
  renderPanels();
  applyRoute(state.current || routeFromHash() || 'home');
}

/* ---------- start ---------- */
(function boot() {
  var savedLang = 'en';
  try {
    var saved = localStorage.getItem(STORE_KEY);
    if (saved) { savedLang = saved; }
  } catch (e) {}

  Promise.all([
    loadJSON('data/site.json').catch(function (e) { throw { path: 'site.json', reason: e.message }; }),
    loadJSON('data/profile.json').catch(function (e) { throw { path: 'profile.json', reason: e.message }; }),
    /* data/live.json is written by the scheduled job in .github/workflows.
       It may not exist yet (or the job may have failed) — never a reason to
       break the page, so a miss quietly becomes null and the page falls back. */
    loadJSON('data/live.json').catch(function () { return null; })
  ]).then(function (first) {
    state.site = first[0];
    state.profile = first[1];
    state.live = first[2];

    /* keep the remembered language only if the file still offers it */
    var codes = (state.site.languages || []).map(function (l) { return l.code; });
    state.lang = codes.indexOf(savedLang) >= 0 ? savedLang : (state.site.defaultLanguage || codes[0] || 'en');

    return Promise.all((state.site.nav || []).map(function (item) {
      var file = item.dataFile || (item.id + '.json');
      return loadJSON('data/' + file).catch(function (e) { throw { path: file, reason: e.message }; });
    }));
  }).then(function (panelData) {
    (state.site.nav || []).forEach(function (item, i) { state.panels[item.id] = panelData[i]; });
    render();
    window.addEventListener('hashchange', function () {
      applyRoute(routeFromHash());
    });
  }).catch(function (err) {
    fail(err && err.path, (err && err.reason) || 'unknown error');
  });
})();
</script>
</body>
</html>
