<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Susie Meow</title>
<meta id="metaDescription" name="description" content="" />
<!-- a real href from the start, so the browser never asks for /favicon.ico; JS swaps in profile.favicon once it loads -->
<link id="favicon" rel="icon" href="assets/avatar-youtube.jpg" />

<!-- One family, Archivo: its width axis carries the hierarchy, weight does the rest.
     Noto Sans SC only carries the Chinese copy. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />

<script>
  /* set language before first paint so there is no flash of English */
  try {
    var saved = localStorage.getItem('site-lang');
    if (saved === 'zh') { document.documentElement.lang = 'zh-CN'; }
  } catch (e) {}
</script>

<style>
/* ============================================================
   TOKENS
   Print shop: one grey stock, one ink, one spot colour (the
   magenta of her own avatar). Hierarchy comes from rule weight
   and type width, never from shadows or gradients.
   ============================================================ */
:root{
  --stock:      #E9E8E2;   /* page: grey card stock */
  --sheet:      #F5F4F0;   /* raised surface */
  --sheet-hi:   #FBFAF7;

  --ink:        #191521;   /* deep plum-black, a real colour rather than a tinted black */
  --ink-2:      #575264;   /* secondary text */
  --rule:       #CBC9C1;   /* hairline */
  --rule-2:     rgba(25,21,33,.22);

  --spot:       #FF2E7E;   /* the single spot ink */
  --spot-text:  #B01250;   /* legible spot for running text */
  --tint:       rgba(255,46,126,.10);

  --sidebar-w: 300px;
  /* One module, and it is the only width in the sheet: the column of type, the
     width of every rule and every box in that column, and — doubled, with the
     column gap between — the width of the sheet once it carries two columns.
     A printed sheet has one column edge; a rule that stops short of the box it
     introduces, or a list that runs wider than the paragraph above it, reads as
     a mistake rather than as a measure. 42rem ≈ 73 characters of body text,
     which is inside the <80 the brief allows and inside the column edge by
     definition, because it is the column edge. */
  --measure: 42rem;
  --col-gap: clamp(2.25rem, 3.5vw, 4rem);

  --font: "Archivo", -apple-system, BlinkMacSystemFont, "Segoe UI",
          "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
}

*,*::before,*::after{ box-sizing:border-box; }

html{ -webkit-text-size-adjust:100%; }

body{
  margin:0;
  min-height:100vh;
  background:var(--stock);
  color:var(--ink);
  font-family:var(--font);
  font-size:16px;
  font-weight:400;
  line-height:1.68;
  letter-spacing:-.004em;
  -webkit-font-smoothing:antialiased;
}

a{ color:inherit; }

:focus-visible{
  outline:2px solid var(--spot-text);
  outline-offset:3px;
}

.skip{
  position:fixed; top:.6rem; left:.6rem; z-index:80;
  transform:translateY(-200%);
  background:var(--ink); color:var(--sheet);
  padding:.55rem .9rem;
  font-size:.82rem; text-decoration:none;
  transition:transform .18s ease;
}
.skip:focus{ transform:none; }

/* ============================================================
   RAIL — same stock as the page, cut off by one heavy ink rule
   ============================================================ */
.plate{
  position:fixed;
  inset:0 auto 0 0;
  width:var(--sidebar-w);
  z-index:20;
  display:flex;
  flex-direction:column;
  gap:1.25rem;
  padding:36px 26px 26px;
  background:var(--stock);
  border-right:2px solid var(--ink);
  overflow-y:auto;
}

/* the one flourish in the layout: the portrait is printed with the
   spot plate 5px out of register */
.avatar{
  width:74px; height:74px;
  display:block;
  object-fit:cover;
  border:1px solid var(--ink);
  box-shadow:5px 5px 0 var(--spot);
}
.avatar-ring{ display:inline-block; line-height:0; }

.identity .name{
  margin:1rem 0 .3rem;
  font-size:1.35rem;
  font-weight:700;
  font-variation-settings:"wdth" 94;
  letter-spacing:-.018em;
  line-height:1.15;
}
.identity .role{
  margin:0;
  font-size:.83rem;
  line-height:1.6;
  color:var(--ink-2);
}

.rule-line{
  height:2px; border:0; margin:0;
  background:var(--ink);
}

/* nav: a tally light in front of every row */
.nav ul{ list-style:none; margin:0; padding:0; }
.nav li + li{ border-top:1px solid var(--rule); }

.nav a{
  display:flex; align-items:center; gap:.75rem;
  padding:.6rem 0;
  color:var(--ink-2);
  text-decoration:none;
  font-size:.95rem; font-weight:500;
  font-variation-settings:"wdth" 100;
  transition:color .16s ease;
}
.nav a::before{
  content:"";
  flex:0 0 auto;
  width:9px; height:9px;
  border:1px solid var(--rule-2);
  transition:background .16s ease, border-color .16s ease;
}
.nav a:hover{ color:var(--ink); }
.nav a:hover::before{ border-color:var(--ink); }
.nav a[aria-current="page"]{
  color:var(--ink);
  font-weight:600;
}
.nav a[aria-current="page"]::before{
  background:var(--spot);
  border-color:var(--spot);
}

/* language: two words and a slash, no chrome around them */
.lang{
  display:flex; align-items:center;
  margin-top:-.35rem;
  font-size:.8rem;
  font-variation-settings:"wdth" 108;
}
.lang button{
  appearance:none; border:0; background:none; padding:.15rem 0;
  font:inherit; font-variation-settings:inherit;
  color:var(--ink-2); cursor:pointer;
  border-bottom:1px solid transparent;
  transition:color .16s ease, border-color .16s ease;
}
/* the slash between two languages, and its breathing room. Kept out of the
   buttons so the active-language rule below can hug the word itself. */
.lang-sep{ margin:0 .5rem; color:var(--rule); }
.lang button:hover{ color:var(--ink); }
.lang button[aria-pressed="true"]{
  color:var(--ink); font-weight:600;
  border-bottom-color:var(--spot);
}

.plate-foot{
  margin-top:auto; padding-top:1.5rem;
  font-size:.76rem;
  font-variation-settings:"wdth" 108;
  letter-spacing:.01em;
  color:var(--ink-2);
  display:flex; align-items:center; gap:.55rem;
}
.plate-foot .dot{
  width:8px; height:8px;
  background:var(--spot);
}

/* ============================================================
   CONTENT
   ============================================================ */
.main{
  margin-left:var(--sidebar-w);
  min-height:100vh;
  padding:clamp(3rem, 8vh, 5.5rem) clamp(1.5rem, 5vw, 4.5rem) 6rem;
}

.panel{
  /* the sheet is one column of --measure, and everything in it ends on that edge */
  max-width:var(--measure); display:none;
  /* The opacity the two phases hand over at. Faint enough to read as nothing, so
     the swap happening underneath it cannot be seen — and not 0, so the content
     column is never blank: the eye reads one continuous dip instead of a blink. */
  --dip:.08;
}
.panel.is-active{ display:block; }

/* Everything in the sheet ends on the column edge: paragraphs, headings, the
   lede, the lists, the ledgers, the picture. The colophon is the one exception,
   and only for its type — .79rem run the full column would be ninety-odd
   characters to the line, so the small print is set to its own measure inside
   the column. Padding rather than max-width, because the hairline above it is a
   rule, and a rule belongs to the column rather than to the sentence under it. */
.panel > .foot{ padding-right:calc(100% - 30rem); }

/* Switching sheets — a short dissolve, and nothing else.
   Printed matter does not slide, so the move is opacity only, in the same
   .3s-ish band everything else on the page moves in. It is two phases rather
   than a cross-dissolve because the panels sit in the normal flow (they are
   different heights, so they have to) and their words lie straight on the paper:
   fading one into the other would double-expose two sets of text. So the sheet
   on screen dims first, and the incoming one is printed in its place — the two
   meet at --dip, where neither sheet is legible and neither is missing.
   The two easings are a pair: the out settles into the dip, the in leaves it at
   once and eases off — so the handover is invisible and the move reads as one
   dip rather than a blink. Both curves were picked by walking them frame by
   frame at 60 Hz: the largest single-frame change is 0.2 either way, and the
   step across the swap is 0.002 (the dip itself, 0.08, is the one value both
   curves share).
   Only a real change of sheet animates: the first paint and a language re-render
   arrive instantly, because neither of them is a jump.
   The out duration is mirrored by LEAVE_MS in the script below — change both
   together. The enter class takes itself off on animationend, so its duration
   lives here only. */
.panel.is-leaving{ animation:panel-out .12s cubic-bezier(.35, 0, .65, 1) both; }
.panel.is-entering{ animation:panel-in .16s cubic-bezier(0, 0, .58, 1) both; }
@keyframes panel-out{ from{ opacity:1; } to{ opacity:var(--dip); } }
@keyframes panel-in{ from{ opacity:var(--dip); } to{ opacity:1; } }

h1,h2,h3{ margin:0; font-weight:700; letter-spacing:-.02em; line-height:1.3; }

.display{
  margin:0 0 1.1rem;
  font-size:clamp(1.95rem, 4.1vw, 2.85rem);
  line-height:1.12;
  font-variation-settings:"wdth" 92;
  /* no measure of its own: the heading is the sheet's line, so it runs the sheet
     and breaks where the sheet breaks — never a few characters short of it */
  text-wrap:balance;
}

.lede{
  margin:0 0 1.4rem;
  font-size:1.08rem;
  line-height:1.7;
  color:var(--ink-2);
}
p{
  margin:0 0 1.15rem;
  /* the column above measures it now — a second ch limit here would only make the
     paragraphs stop short of the column they were given */
  max-width:none;
  overflow-wrap:break-word;
}
p:last-child{ margin-bottom:0; }

/* A blank line inside a paragraph (`\n\n` in the JSON) — a wider break than a plain
   newline, which is just the line box's own leading (~9.7px at the body sizes). This
   adds 0.6rem on top of that, landing at ~19px end to end: about the weight of the
   1.15rem paragraph rhythm. Deliberate — inside one paragraph, a blank line should read
   as heavily as a new paragraph, without actually splitting the text in two. */
.line-gap{ display:block; height:.6rem; }

.section-title{
  margin:3rem 0 1rem;
  padding-top:.7rem;
  border-top:2px solid var(--ink);
  font-size:1.08rem;
  font-variation-settings:"wdth" 104;
  letter-spacing:-.008em;
  line-height:1.35;
  text-wrap:balance;
}

.link{
  color:var(--spot-text);
  text-decoration:underline;
  text-decoration-thickness:1px;
  text-underline-offset:2px;
  transition:text-decoration-thickness .14s ease, background .14s ease;
}
.link:hover{
  text-decoration-thickness:3px;
  background:var(--tint);
}

/* the latest upload: real material, cropped back to 16:9 */
.video{ margin:0 0 1.75rem; }
/* the picture wrapper only — the caption's own link must stay inline,
   otherwise it picks up the frame border and pushes the caption to a new line */
.video > a{
  display:block;
  border:1px solid var(--ink);
  transition:box-shadow .16s ease;
}
.video > a:hover{ box-shadow:inset 0 0 0 2px var(--spot); }
.video img{
  display:block; width:100%;
  aspect-ratio:16 / 9;
  object-fit:cover;
}
.video figcaption{
  margin-top:.65rem;
  font-size:.82rem;
  color:var(--ink-2);
}
/* the embedded Bilibili player sits in the same 16:9 frame a still would */
.video-embed{
  display:block; width:100%;
  aspect-ratio:16 / 9;
  border:1px solid var(--ink);
  background:var(--ink);
}
.video-more{ display:block; margin-top:.35rem; }

/* rows: hairlines, and a marker underline where the pointer is.
   The hairlines run the column like every other rule on the sheet. */
.rows{ list-style:none; margin:0; padding:0; }
.rows > li{ border-bottom:1px solid var(--rule); }
.rows > li:first-child{ border-top:1px solid var(--rule); }

/* text starts on the same left edge as the headings; the hover wash and the
   hairline share that edge, so nothing looks nudged out of line */
.row{
  display:flex; align-items:baseline; gap:2rem;
  padding:1.15rem 0;
  text-decoration:none;
  transition:background .16s ease;
}
.row:hover{ background:var(--sheet); }

.row-main{ flex:1 1 auto; min-width:0; }
.row-title{
  font-size:1.02rem;
  font-variation-settings:"wdth" 96;
  line-height:1.35;
  margin-bottom:.3rem;
}
.row:hover .row-title{
  text-decoration:underline;
  text-decoration-thickness:2px;
  text-decoration-color:var(--spot);
  text-underline-offset:3px;
}
.row-note{
  margin:0;
  font-size:.89rem; line-height:1.62;
  color:var(--ink-2);
  overflow-wrap:break-word;
}
.row-meta{
  flex:0 0 auto;
  font-size:.78rem;
  font-variation-settings:"wdth" 108;
  color:var(--ink-2);
  white-space:nowrap;
}

/* rundown table on the home page */
.index{ margin:0; }
.index div{
  display:flex; align-items:baseline; gap:1.5rem;
  padding:.85rem 0;
  border-bottom:1px solid var(--rule);
}
.index div:first-child{ border-top:1px solid var(--ink); }
.index dt{
  flex:0 0 10rem;
  font-size:.8rem;
  font-variation-settings:"wdth" 108;
  color:var(--ink-2);
}
.index dd{ margin:0; flex:1 1 auto; font-size:.94rem; overflow-wrap:break-word; }

/* works & achievements: a dated rail. One printed rule down the middle, a spot
   square for every entry, and the card hung off it on the right.
   The date is set flush left, so the ledger stands on the same left edge as the
   heading and the lede above it — every date in the data starts with the year,
   so flush left keeps the years in their own column just as right-alignment did,
   while the first thing the eye meets in a row is the sheet's own edge. */
.timeline{
  --t-date: 4rem;     /* the ledger column — as wide as the longest date the
                         data actually carries (2026.10 ≈ 3.25rem) plus air, so
                         a longer one still lands short of the rail */
  --t-rail: 1.5rem;   /* the rail the spine runs down */
  /* where the middle of a card's first line sits, measured down from the row's
     top: the card's own top padding, plus half the title's line box
     (1.1rem + 1.02rem × 1.4 ÷ 2). The date, the square and the pointer all hang
     off this one number, so nothing drifts out of line when the card changes. */
  --t-lead: 1.81rem;
  position:relative;
  list-style:none;
  margin:0; padding:0;
}
/* one continuous rule behind every row, so the segments can never seam */
.timeline::before{
  content:"";
  position:absolute;
  inset:0 auto 0 calc(var(--t-date) + var(--t-rail) / 2 - 1px);
  width:2px;
  background:var(--ink);
}
.tl-item{
  display:grid;
  grid-template-columns:var(--t-date) var(--t-rail) 1fr;
  grid-template-areas:"date rail card";
  align-items:start;
  padding:0 0 1.4rem;
}
/* An entry the filter has ruled out. The row has to say so itself: `display:grid`
   above outranks the browser's own [hidden] rule, so without this the entry
   would stay on the sheet and the filter would look broken. */
.tl-item[hidden]{ display:none; }

.tl-date{
  grid-area:date;
  /* its own line box is .74rem × 1.68, so this lands its centre on --t-lead.
     No side padding: the date's own left edge has to be the column's, or the
     ledger stops lining up with the sheet's edge above it. */
  padding:calc(var(--t-lead) - .62rem) 0 0;
  text-align:left;
  font-size:.74rem; font-weight:500;
  font-variation-settings:"wdth" 112;
  letter-spacing:.03em;
  font-variant-numeric:tabular-nums;
  color:var(--ink-2);
}
/* the tally light again, one size up and printed in the spot ink. It stays the
   biggest mark on the rail — the pointer below is deliberately smaller, so the
   colour reads as the anchor and the wedge as its tail. The ring is the stock
   colour, so the spine is knocked out around it instead of bleeding into it —
   the same trick as the portrait's offset plate, without the offset. */
.tl-node{
  grid-area:rail;
  justify-self:center;
  width:13px; height:13px;
  margin-top:calc(var(--t-lead) - .41rem);   /* half of the square */
  background:var(--spot);
  box-shadow:0 0 0 3px var(--stock);
}

.tl-card{
  grid-area:card;
  position:relative;
  /* small: the square sits in the middle of the 1.5rem rail, so the visible gap
     between them is this plus half the rail */
  margin-left:.15rem;
  padding:1.1rem clamp(1rem, 2.2vw, 1.3rem);
  background:var(--sheet);
  border:1px solid var(--ink);
  transition:background .16s ease;
}
.tl-card:hover{ background:var(--sheet-hi); }
/* the pointer back to the rail: a hard ink wedge, same ink as the card's own
   rule, sized to exactly span the gap between the square and the card's edge.
   The extra 1px is the card's own border — `top` here is measured from its
   padding box. */
.tl-card::before{
  content:"";
  position:absolute; left:-8px; top:calc(var(--t-lead) - 6.5px);
  width:9px; height:11px;
  background:var(--ink);
  clip-path:polygon(100% 0, 0 50%, 100% 100%);
}
.tl-head{ display:flex; flex-wrap:wrap; align-items:baseline; gap:.9rem; }
.tl-title{
  margin:0;
  font-size:1.02rem;
  font-variation-settings:"wdth" 96;
  line-height:1.4;
}
/* the type plate and the optional kind both hang on the far end of the title
   line. Each carries margin-left:auto — the first one to claim it takes all the
   free space and the other gets none — so either can sit there alone, and with
   both they pair up on the right without needing a wrapper element. */
.tl-kind{
  margin-left:auto; flex:0 0 auto;
  font-size:.72rem; font-weight:500;
  font-variation-settings:"wdth" 112;
  letter-spacing:.03em;
  color:var(--ink-2);
}
.tl-note{
  margin:.5rem 0 0;
  font-size:.89rem; line-height:1.62;
  color:var(--ink-2);
  overflow-wrap:break-word;
}

/* Narrow screens used to fold the ledger column up over the card, which put the
   date's left edge wherever the rail happened to be — a second left edge for the
   same page. The ledger now keeps its column at every width instead: a phone
   pays for it in card width (about 180px at the narrowest), and the sheet keeps
   the single left edge its heading, lede and dates all stand on. */

/* The filter, on the line under the lede, and the tags, under the rail.
   A control in this sheet is bare type with a small mark in front of it — the
   nav does exactly this — while a box in this sheet is a surface that holds
   something. So the filter is type and a tally light, and a tag is a plate.
   A paper tag and a button therefore never look alike, which is the point:
   the buttons above are pressed, the tags below are only the page's own filing. */
.filter{
  display:flex; flex-wrap:wrap; align-items:center;
  gap:.9rem 1.6rem;
  margin:0 0 1.9rem;
}
.filter-btn{
  appearance:none; -webkit-appearance:none;
  border:0; background:none; padding:0; margin:0;
  display:flex; align-items:center; gap:.55rem;
  font-family:inherit; font-size:.8rem; font-weight:500;
  font-variation-settings:"wdth" 108;
  letter-spacing:.02em;
  color:var(--ink-2);
  cursor:pointer;
  transition:color .16s ease;
}
/* the tally light, one size down from the nav's and with the same two states:
   an empty ring for a plain choice, spot ink for the one in force */
.filter-btn::before{
  content:"";
  flex:0 0 auto;
  width:9px; height:9px;
  border:1px solid var(--rule-2);
  transition:background .16s ease, border-color .16s ease;
}
.filter-btn:hover{ color:var(--ink); }
.filter-btn:hover::before{ border-color:var(--ink); }
.filter-btn[aria-pressed="true"]{ color:var(--ink); font-weight:600; }
.filter-btn[aria-pressed="true"]::before{
  background:var(--spot); border-color:var(--spot);
}

/* a tag is a small plate — the same plate on the entry and in the list below,
   so the two read as one label seen twice rather than two different things */
.tag,
.tl-tag{
  flex:0 0 auto;
  padding:.08rem .42rem;
  border:1px solid var(--rule-2);
  font-size:.72rem; font-weight:500;
  font-variation-settings:"wdth" 112;
  letter-spacing:.03em;
  line-height:1.35;
  color:var(--ink-2);
  white-space:nowrap;
}
.tl-tag{ margin-left:auto; }

/* the page's own filing, under the rail and on the rail's left edge: the rule
   above it is the sheet's heavy rule, the same one a section break uses */
.taglist{
  display:flex; flex-wrap:wrap; align-items:center;
  gap:.5rem .5rem;
  margin:1.6rem 0 0;      /* plus the last row's 1.4rem = the 3rem a section break takes */
  padding:.85rem 0 0;
  border-top:2px solid var(--ink);
}
.taglist-label{
  flex:0 0 auto;
  margin-right:.35rem;
  font-size:.74rem; font-weight:600;
  font-variation-settings:"wdth" 112;
  letter-spacing:.03em;
  color:var(--ink);
}

.foot{
  margin:3rem 0 0; padding-top:1rem;
  border-top:1px solid var(--rule);
  font-size:.79rem; line-height:1.65;
  color:var(--ink-2);
}

/* a post: same column as the panels, one step narrower for long reading.
   Body blocks are data (see data/posts/*.json) — this is only the type. */
.post-back{
  margin:0 0 1.5rem;
  font-size:.82rem;
  font-variation-settings:"wdth" 108;
}
.post-meta{
  margin:.55rem 0 0;
  font-size:.76rem; font-variation-settings:"wdth" 112;
  letter-spacing:.02em;
  color:var(--ink-2);
}

/* a post has no second column, so it reads as one sheet of type, measured by
   .panel > .prose above like every other block of running text */
/* a post with no lede: without this the date sits flush against the first block,
   because the first child's own top margin is zeroed just below */
.post-meta + .prose{ margin-top:1.5rem; }
.prose > *:first-child{ margin-top:0; }
.prose > *:last-child{ margin-bottom:0; }

/* top margins only, so the rhythm never doubles up */
.prose p{ margin:1.05rem 0 0; }
.prose h2{
  margin:2.3rem 0 0;
  font-size:1.1rem;
  font-variation-settings:"wdth" 100;
}
.prose h3{
  margin:1.8rem 0 0;
  font-size:.99rem;
}
.prose ul,.prose ol{ margin:1.05rem 0 0; padding-left:1.2rem; }
.prose li{ margin:.3rem 0; }
.prose li::marker{ color:var(--spot-text); }

.prose blockquote{
  margin:1.5rem 0 0;
  padding:.15rem 0 .15rem 1.1rem;
  border-left:3px solid var(--spot);
  color:var(--ink-2);
}

.prose pre{
  margin:1.4rem 0 0;
  padding:1rem 1.15rem;
  overflow-x:auto;
  background:var(--sheet);
  border-left:3px solid var(--ink);
  font-size:.83rem; line-height:1.62;
}
.prose code{
  font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
/* emphasis inside a sentence, without the variable font drifting wider */
.prose strong{ font-weight:700; font-variation-settings:"wdth" 100; }
.prose p code,.prose li code{
  background:var(--tint);
  padding:.1em .35em;
  font-size:.9em;
}

.prose figure{ margin:1.8rem 0 0; }
.prose figure img{ display:block; width:100%; border:1px solid var(--ink); }
.prose figure figcaption{
  margin-top:.7rem;
  font-size:.78rem; line-height:1.6;
  color:var(--ink-2);
}

/* ============================================================
   NARROW SCREENS — the rail becomes a masthead band
   ============================================================ */
@media (max-width: 940px){
  /* the masthead and the content share one left edge */
  .main{
    margin-left:0;
    padding:1.75rem clamp(1rem, 4vw, 1.5rem) 4.5rem;
  }

  .plate{
    position:static; width:auto; inset:auto;
    display:grid;
    grid-template-columns:auto minmax(0,1fr) auto;
    grid-template-areas:"av id lang" "nav nav nav";
    align-items:center;
    column-gap:.9rem; row-gap:.9rem;
    padding:16px clamp(1rem, 4vw, 1.5rem) 14px;
    border-right:0;
    border-bottom:2px solid var(--ink);
    overflow:visible;
  }
  .avatar-ring{ grid-area:av; }
  .identity{ grid-area:id; min-width:0; }
  .lang{ grid-area:lang; margin-top:0; }
  .nav{ grid-area:nav; }

  .avatar{ width:46px; height:46px; box-shadow:3px 3px 0 var(--spot); }
  .identity .name{ margin:0 0 .1rem; font-size:1.08rem; }
  .identity .role{
    font-size:.78rem; line-height:1.5;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }

  .rule-line{ display:none; }

  .nav ul{
    display:flex;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .nav ul::-webkit-scrollbar{ display:none; }
  .nav li + li{ border-top:0; }
  .nav a{
    white-space:nowrap;
    padding:.3rem .85rem;
    border-left:1px solid var(--rule);
  }
  .nav li:first-child a{ border-left:0; padding-left:.1rem; }
  .nav a::before{ display:none; }
  .nav a[aria-current="page"]{
    text-decoration:underline;
    text-decoration-thickness:2px;
    text-decoration-color:var(--spot);
    text-underline-offset:4px;
  }

  .plate-foot{ display:none; }

  /* stacked rows: baseline alignment no longer applies across the column,
     so both blocks switch to start alignment to keep one clean left edge */
  .index div{ flex-direction:column; align-items:flex-start; gap:.2rem; padding:1rem 0; }
  .index dt{ flex:none; }

  .row{ flex-direction:column; align-items:flex-start; gap:.4rem; padding:1.1rem 0; }
}

/* ============================================================
   WIDE SCREENS — the sheet takes a second column
   Rail, then a sheet. Until here the sheet has been one column of
   type, which on a 2560px screen left two thirds of the stock bare.
   Past 106rem there is room to print it as two columns, the way a
   broadside would: the reading column, and beside it the things that
   are not reading — the picture, the rundown table, the list of posts.
   A dated rail is the one list that cannot move over: it is read as a
   single row of date, rule and card, so it stays in the reading column.
   Both columns are the same module, so the sheet keeps one edge down
   the middle and one down the right, and the heading — the sheet's
   own line — runs the whole of it. 106rem is where the second column
   comes out around 590px and grows to the full module by about
   1850px; below it the split would squeeze a ledger under 500px, so
   the sheet stays one column there, and the paper left over is a
   margin, which a sheet is entitled to.
   ============================================================ */
@media (min-width: 106rem){
  .panel.is-active{
    display:grid;
    grid-template-columns:minmax(0, var(--measure)) minmax(0, var(--measure));
    column-gap:var(--col-gap);
    align-content:start;
    max-width:calc(var(--measure) * 2 + var(--col-gap));
  }
  /* the heading is the sheet's own line, not the column's */
  .panel > .display{ grid-column:1 / -1; }
  /* the reading column … */
  .panel > .lede,
  .panel > p,
  .panel > .prose,
  .panel > .section-title,
  .panel > .filter,
  .panel > .taglist,
  .panel > .timeline{ grid-column:1; }
  /* … and what sits beside it. The timeline is deliberately not in this list:
     a dated rail is one continuous object — its date, its rule and its card are
     a single row and cannot be split over two columns — so it keeps the first
     column, which is also what puts the dates on the same left edge as the
     heading and the lede they belong to. */
  .panel > .video,
  .panel > .index,
  .panel > .rows{ grid-column:2; }
}

@media (prefers-reduced-motion: reduce){
  *{ animation:none !important; transition:none !important; }
}
</style>
</head>

<body>
<a class="skip" href="#main" id="skip">Skip to content</a>

<!-- ============ RAIL ============ -->
<header class="plate">
  <span class="avatar-ring">
    <!-- same idea as the favicon: a real src from the start, so that if /data cannot be
         read (double-clicking the file) the rail shows an avatar instead of a broken image -->
    <img class="avatar" id="avatar" src="assets/avatar-youtube.jpg" alt="" width="74" height="74" />
  </span>

  <div class="identity">
    <p class="name" id="profileName"></p>
    <p class="role" id="profileRole"></p>
  </div>

  <hr class="rule-line" />

  <nav class="nav" id="nav" aria-label="Sections">
    <ul id="navList"></ul>
  </nav>

  <div class="lang" id="langSwitch" role="group"></div>

  <p class="plate-foot"><span class="dot" aria-hidden="true"></span><span id="profileStatus"></span></p>
</header>

<!-- ============ CONTENT (rendered from /data) ============ -->
<main class="main" id="main"></main>

<script>
/* ============================================================
   Everything visible is rendered from the JSON files in /data.
   Edit those files to change the site — this script stays as is.

   data/site.json       navigation, languages, page titles
   data/profile.json    avatar, name, tagline, status line
   data/home.json       the Home panel
   data/blog.json       the Blog panel
   data/works.json      the Works & achievements panel
   data/elsewhere.json  the Find me elsewhere panel
   data/posts/*.json    one file per post, fetched the first time it is opened

   A list item that carries a "post" field links to #post/<slug> instead of
   an outside URL, and the post renders in place from its own JSON file.
   ============================================================ */
var STORE_KEY = 'site-lang';

var state = {
  site: null,
  profile: null,
  panels: {},   /* panel id -> json */
  posts: {},    /* slug -> json, filled lazily by showPost() */
  live: null,   /* data/live.json — written by the scheduled sync, may be absent */
  lang: 'en',
  current: '',  /* current route: a panel id, or "post/<slug>" */
  /* which type the works rail is filtered to: '' is everything. Kept out here
     rather than in the markup because a language switch rebuilds every panel
     from scratch, and the reader's choice has to survive that. */
  tag: ''
};

/* ---------- helpers ---------- */
function esc(value) {
  return String(value === null || value === undefined ? '' : value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

/* a value may be a plain string, or { en: …, zh: … }, or rich parts */
function localized(value, lang) {
  if (value === null || value === undefined) { return ''; }
  if (typeof value === 'string' || Array.isArray(value)) { return value; }
  if (typeof value === 'object') {
    if (value[lang] !== undefined) { return value[lang]; }
    var fallback = (state.site && state.site.defaultLanguage) || 'en';
    if (value[fallback] !== undefined) { return value[fallback]; }
    var keys = Object.keys(value);
    return keys.length ? value[keys[0]] : '';
  }
  return String(value);
}

/* rich parts: [ { text }, { text, url }, { text, code }, { text, strong } ] -> escaped html
   A newline becomes <br>, so one paragraph can hold a short stack of lines (a list of
   handles, say) without needing a block type for it. A blank line becomes a wider gap
   (.line-gap), so the same paragraph can still set its lead-in and closing line apart
   from the list in the middle. */
function withBreaks(html) {
  return html.replace(/\n[ \t]*\n/g, '<span class="line-gap"></span>')
             .replace(/\n/g, '<br>');
}

function rich(value) {
  if (Array.isArray(value)) {
    return value.map(function (part) {
      if (!part) { return ''; }
      var text = withBreaks(esc(part.text === undefined ? '' : part.text));
      if (part.url) { return '<a class="link" href="' + esc(part.url) + '">' + text + '</a>'; }
      if (part.code) { return '<code>' + text + '</code>'; }
      if (part.strong) { return '<strong>' + text + '</strong>'; }
      return text;
    }).join('');
  }
  return withBreaks(esc(value === undefined || value === null ? '' : value));
}

function field(value) { return rich(localized(value, state.lang)); }
function plain(value) { return esc(localized(value, state.lang)); }

/* ---------- loading ---------- */
function loadJSON(path) {
  return fetch(path, { cache: 'no-store' }).then(function (res) {
    if (!res.ok) { throw new Error('HTTP ' + res.status); }
    return res.json().then(function (json) { return json; }, function () {
      throw new Error('not valid JSON');
    });
  }, function () {
    throw new Error('could not be loaded');
  });
}

function fail(path, reason) {
  var main = document.getElementById('main');
  var fileHint = path ? '<code>data/' + esc(path) + '</code>' : '';
  main.innerHTML =
    '<div class="panel is-active">' +
      '<h1 class="display">Data could not be loaded / 数据没能读进来</h1>' +
      '<p class="lede">There is a problem with ' + fileHint + ' — ' + esc(reason) + '. ' +
      '检查这个文件里的逗号、引号是否配对。</p>' +
      '<p class="foot">Opening this file straight from your hard drive (file://…) cannot read JSON. ' +
      'Serve the folder over http, for example <code>python3 -m http.server 8000</code>, then visit ' +
      '<code>http://localhost:8000</code>. On GitHub Pages everything works automatically. ' +
      '双击 index.html 直接打开是读不到 JSON 的，需要用上面的本地服务器方式预览；发布到 GitHub Pages 后不受影响。</p>' +
    '</div>';
}

/* ---------- rail ---------- */
function renderRail() {
  var profile = state.profile || {};
  var avatar = profile.avatar || {};

  var img = document.getElementById('avatar');
  if (avatar.src) { img.src = avatar.src; }
  img.alt = plain(avatar.alt);

  document.getElementById('profileName').textContent = plain(profile.name);
  document.getElementById('profileRole').innerHTML = field(profile.role);
  document.getElementById('profileStatus').innerHTML = field(profile.status);
  document.getElementById('skip').textContent = plain(state.site.skipLink);

  if (avatar.src) { document.getElementById('favicon').href = profile.favicon || avatar.src; }
  document.getElementById('metaDescription').content = plain(state.site.metaDescription);

  document.documentElement.lang = (state.lang === 'zh') ? 'zh-CN' : 'en';

  /* nav */
  document.getElementById('navList').innerHTML = (state.site.nav || []).map(function (item) {
    return '<li><a href="#' + esc(item.id) + '" data-nav="' + esc(item.id) + '">' +
           field(item.label) + '</a></li>';
  }).join('');

  /* language switch */
  /* language switch — the slash is its own element, not a ::after on the button:
     the active language is marked with a border-bottom, and a pseudo-element would
     drag that rule out under the slash and its margins too. */
  var group = document.getElementById('langSwitch');
  group.setAttribute('aria-label', plain(state.site.languageGroupLabel));
  group.innerHTML = (state.site.languages || []).map(function (lang, i) {
    return (i ? '<span class="lang-sep" aria-hidden="true">/</span>' : '') +
           '<button type="button" data-lang="' + esc(lang.code) + '" aria-pressed="' +
           (lang.code === state.lang ? 'true' : 'false') + '">' + esc(lang.label) + '</button>';
  }).join('');
  Array.prototype.forEach.call(group.querySelectorAll('button'), function (b) {
    b.addEventListener('click', function () {
      var code = b.getAttribute('data-lang');
      if (code === state.lang) { return; }
      state.lang = code;
      try { localStorage.setItem(STORE_KEY, code); } catch (e) {}
      render();
    });
  });
}

/* ---------- panels ---------- */
/* ---------- the "latest video" slot ----------
   Three states, in this order of priority:

     1. video.bvid is filled in         -> Bilibili's own player, embedded.
                                           Filling in one BV id is the only
                                           manual step the site asks for.
     2. data/live.json has an upload    -> its cover, title and link. All three
                                           are written together by
                                           tools/sync_latest.py, so the picture
                                           and the caption cannot drift apart.
     3. neither                         -> the hand-written video.image / .url
                                           / .linkText, i.e. the old behaviour.

   The browser never calls YouTube or Bilibili itself: neither sends CORS
   headers (and Bilibili answers 412 to anything it doesn't like), so the
   fetching happens outside the page, in a scheduled job.
   ============================================ */
function videoFigure(video) {
  if (!video || !video.enabled) { return ''; }

  var live = (state.live && state.live.youtube) || null;
  var suffix = rich(localized(video.suffix, state.lang));

  /* 1 — a BV id means she wants the Bilibili player in the frame */
  if (video.bvid) {
    var watch = 'https://www.bilibili.com/video/' + video.bvid;
    var also = '';
    if (live && live.url) {
      also = '<span class="video-more">' + field(video.autoLabel) +
               '<a class="link" href="' + esc(live.url) + '">' + esc(live.title) + '</a>' +
             '</span>';
    }
    return '<figure class="video">' +
             '<iframe class="video-embed" src="https://player.bilibili.com/player.html?bvid=' +
               esc(video.bvid) + '&amp;page=1&amp;high_quality=1&amp;danmaku=0&amp;autoplay=0"' +
               ' title="' + plain(video.alt) + '" loading="lazy"' +
               ' scrolling="no" frameborder="0" allowfullscreen="true"></iframe>' +
             '<figcaption><a class="link" href="' + esc(watch) + '">' +
               field(video.watchLabel) + '</a>' + also + '</figcaption>' +
           '</figure>';
  }

  /* 2 + 3 — a cover picture; the auto one only when the sync has run */
  var cover = video.image || (live ? 'assets/auto-latest.jpg' : '');
  if (!cover) { return ''; }

  var url = (live && live.url) || video.url || '';
  var caption = (live && live.title) || video.linkText || '';
  var img = '<img src="' + esc(cover) + '" alt="' + plain(video.alt) + '" />';

  return '<figure class="video">' +
           (url ? '<a href="' + esc(url) + '">' + img + '</a>' : img) +
           (caption
             ? '<figcaption><a class="link" href="' + esc(url || '#') + '">' +
                 esc(caption) + '</a>' + suffix + '</figcaption>'
             : '') +
         '</figure>';
}

function renderHome(id, data) {
  var html = '<h1 class="display" id="' + esc(id) + '-title">' + field(data.heading) + '</h1>';
  html += '<p class="lede">' + field(data.lede) + '</p>';

  (data.paragraphs || []).forEach(function (para) {
    html += '<p>' + field(para) + '</p>';
  });

  var videoHtml = videoFigure(data.video);

  /* the latest video leads the "Lately" group, so the thumbnail sits under a
     heading instead of floating between the prose and the next section */
  var lately = data.lately;
  if (lately && (lately.items || []).length) {
    html += '<h2 class="section-title">' + field(lately.title) + '</h2>';
    html += videoHtml;
    html += '<dl class="index">';
    (lately.items).forEach(function (item) {
      html += '<div><dt>' + field(item.label) + '</dt><dd>' + field(item.value) + '</dd></div>';
    });
    html += '</dl>';
  } else {
    html += videoHtml;
  }

  /* no footnote here — renderPanels() appends it once for every layout */
  return html;
}

function renderRows(items) {
  if (!items || !items.length) { return ''; }
  return '<ul class="rows">' + items.map(function (item) {
    var inner = '<span class="row-main">' +
                  '<h3 class="row-title">' + field(item.title) + '</h3>' +
                  '<p class="row-note">' + field(item.note) + '</p>' +
                '</span>';
    if (item.meta) { inner += '<span class="row-meta">' + field(item.meta) + '</span>'; }

    /* "post" opens a page inside the site; "url" sends the reader away */
    var href = item.post ? '#post/' + item.post : (item.url || '');
    return '<li>' +
      (href ? '<a class="row" href="' + esc(href) + '">' + inner + '</a>'
            : '<div class="row">' + inner + '</div>') +
      '</li>';
  }).join('') + '</ul>';
}

/* The types a page actually carries, in the order the data first mentions them.
   Read off the entries every time rather than kept as a list of its own: adding
   a type to one entry is then all it takes for the filter above the rail and the
   tags below it to pick it up, and no type can go stale in three places at once. */
function tagSet(data) {
  var map = (data && data.tagLabels) || {};
  var seen = {}, out = [];
  ((data && data.items) || []).forEach(function (item) {
    var keys = (item && item.tags) || [];
    if (typeof keys === 'string') { keys = [keys]; }
    keys.forEach(function (key) {
      if (seen[key]) { return; }
      seen[key] = true;
      /* an unknown key still shows, as itself, rather than vanishing silently */
      out.push({ key: key, label: map[key] === undefined ? { en: key, zh: key } : map[key] });
    });
  });
  return out;
}

/* the filter, on the line under the lede: one button per type the data carries,
   and one way back to everything. Buttons rather than links, because which
   entries are on screen is a state of this page and not a place to be sent to.
   A single type is not a choice, so then there is no filter at all. */
function renderFilter(data) {
  var tags = tagSet(data);
  if (tags.length < 2) { return ''; }
  function button(key, label) {
    return '<button type="button" class="filter-btn" data-tag="' + esc(key) + '"' +
           ' aria-pressed="' + (key === state.tag ? 'true' : 'false') + '">' +
           field(label) + '</button>';
  }
  var html = button('', { en: 'All', zh: '全部' });
  tags.forEach(function (t) { html += button(t.key, t.label); });
  return '<div class="filter" role="group" aria-label="' +
         plain(data.filterLabel || 'Filter') + '">' + html + '</div>';
}

/* the tags the page is filed under, under the rail and on the rail's edge */
function renderTagList(data) {
  var tags = tagSet(data);
  if (!tags.length) { return ''; }
  return '<p class="taglist">' +
           '<span class="taglist-label">' + field(data.tagsLabel || 'Tags') + '</span>' +
           tags.map(function (t) { return '<span class="tag">' + field(t.label) + '</span>'; }).join('') +
         '</p>';
}

/* works & achievements: a dated rail. Each entry is a dated point on one
   continuous rule, with the card hung off it on the right. Newest first — the
   data decides the order, this only draws it.

   Two labels can ride on an entry, both at the far end of the title line and
   neither of them invented here: `kind` is the hand-written word for whether an
   entry is a work or an achievement, and `tags` are keys into data.tagLabels —
   the same keys the filter and the tag list are built from, so an entry and the
   page's own filing can never drift apart. */
function renderTimeline(data) {
  var items = (data && data.items) || [];
  if (!items.length) { return ''; }
  var map = (data && data.tagLabels) || {};
  return '<ol class="timeline">' + items.map(function (item) {
    var title = field(item.title);
    if (item.url) { title = '<a class="link" href="' + esc(item.url) + '">' + title + '</a>'; }
    var keys = item.tags || [];
    if (typeof keys === 'string') { keys = [keys]; }
    var plates = keys.map(function (key) {
      var label = map[key] === undefined ? { en: key, zh: key } : map[key];
      return '<span class="tl-tag">' + field(label) + '</span>';
    }).join('');
    return '<li class="tl-item"' +
      (keys.length ? ' data-tags="' + esc(keys.join(' ')) + '"' : '') + '>' +
      '<span class="tl-date">' + field(item.date) + '</span>' +
      '<span class="tl-node" aria-hidden="true"></span>' +
      '<div class="tl-card">' +
        '<div class="tl-head">' +
          '<h3 class="tl-title">' + title + '</h3>' +
          plates +
          (item.kind ? '<span class="tl-kind">' + field(item.kind) + '</span>' : '') +
        '</div>' +
        '<p class="tl-note">' + field(item.note) + '</p>' +
      '</div>' +
    '</li>';
  }).join('') + '</ol>';
}

/* ---------- posts ----------
   A post is one file: data/posts/<slug>.json. Its body is a list of blocks,
   and the single key of each block decides the element, so writing a post
   stays data work rather than markup work:

     { "p": … }          a paragraph
     { "h2": … }         a sub-heading          { "h3": … } a smaller one
     { "ul": [ … ] }     a bulleted list        { "ol": [ … ] } a numbered one
     { "quote": … }      a pull quote
     { "code": "…" }     a preformatted block (same in both languages)
     { "img": { "src": …, "alt": …, "caption": … } }

   Every text value may be a plain string, { "en": …, "zh": … }, or the rich
   parts array the rest of the site uses for links inside a sentence.
   Rich parts are [ { text }, { text, url }, { text, code }, { text, strong } ]. */
function renderBlocks(body) {
  if (!Array.isArray(body)) { return ''; }
  return body.map(function (block) {
    if (!block) { return ''; }
    if (block.p !== undefined)     { return '<p>' + field(block.p) + '</p>'; }
    if (block.h2 !== undefined)    { return '<h2>' + field(block.h2) + '</h2>'; }
    if (block.h3 !== undefined)    { return '<h3>' + field(block.h3) + '</h3>'; }
    if (block.quote !== undefined) { return '<blockquote>' + field(block.quote) + '</blockquote>'; }
    if (block.code !== undefined)  { return '<pre><code>' + plain(block.code) + '</code></pre>'; }
    if (block.ul !== undefined)    { return '<ul>' + listItems(block.ul) + '</ul>'; }
    if (block.ol !== undefined)    { return '<ol>' + listItems(block.ol) + '</ol>'; }
    if (block.img !== undefined)   { return postFigure(block.img); }
    return '';
  }).join('');
}

function listItems(items) {
  if (!Array.isArray(items)) { return ''; }
  return items.map(function (item) { return '<li>' + field(item) + '</li>'; }).join('');
}

function postFigure(img) {
  if (!img || !img.src) { return ''; }
  return '<figure>' +
           '<img src="' + esc(img.src) + '" alt="' + plain(img.alt) + '" />' +
           (img.caption ? '<figcaption>' + field(img.caption) + '</figcaption>' : '') +
         '</figure>';
}

/* Which panel's list does this slug belong to? Gives the way back and decides
   which nav item stays highlighted while reading. */
function postOwner(slug) {
  var owner = '';
  Object.keys(state.panels).forEach(function (id) {
    var items = (state.panels[id] && state.panels[id].items) || [];
    items.forEach(function (item) { if (item && item.post === slug) { owner = id; } });
  });
  return owner;
}

function renderPost(post, owner) {
  var label = '';
  (state.site.nav || []).forEach(function (item) { if (item.id === owner) { label = item.label; } });

  var html = '<p class="post-back"><a class="link" href="#' + esc(owner) + '">← ' +
             field(label) + '</a></p>';
  html += '<h1 class="display">' + field(post.title) + '</h1>';
  if (post.date) { html += '<p class="post-meta">' + esc(post.date) + '</p>'; }
  if (post.lede) { html += '<p class="lede">' + field(post.lede) + '</p>'; }
  html += '<div class="prose">' + renderBlocks(post.body) + '</div>';
  if (post.footnote) { html += '<p class="foot">' + field(post.footnote) + '</p>'; }
  return html;
}

function renderPanels() {
  var main = document.getElementById('main');
  main.innerHTML = '';

  (state.site.nav || []).forEach(function (item) {
    var data = state.panels[item.id];
    if (!data) { return; }

    var heading = '<h1 class="display" id="' + esc(item.id) + '-title">' + field(data.heading) + '</h1>' +
                  '<p class="lede">' + field(data.lede) + '</p>';

    /* one branch per layout in data/site.json — written out rather than
       defaulted, so the set of layouts this file understands is greppable
       (the data audit reads these names instead of keeping its own copy) */
    var body = '';
    if (item.layout === 'home') { body = renderHome(item.id, data); }
    else if (item.layout === 'list') { body = heading + renderRows(data.items); }
    else if (item.layout === 'timeline') {
      /* filter, then the rail, then the tags the rail is filed under — the
         control above the thing it rules, the legend below it */
      body = heading + renderFilter(data) + renderTimeline(data) + renderTagList(data);
    }
    else { body = heading + renderRows(data.items); }   /* unknown: show the rows */
    if (data.footnote) { body += '<p class="foot">' + field(data.footnote) + '</p>'; }

    var section = document.createElement('section');
    section.className = 'panel';
    section.id = item.id;
    section.setAttribute('aria-labelledby', item.id + '-title');
    section.innerHTML = body;
    section.hidden = true;
    main.appendChild(section);
  });

  applyTagFilter();
}

/* ---------- the type filter ----------
   Which entries are on screen is written onto the rows themselves, and the
   buttons are re-stamped to match, so the markup is always the whole truth:
   a screen reader, the print stylesheet and the next language switch all see
   the filtered state rather than having to ask this script for it. */
function applyTagFilter() {
  Array.prototype.forEach.call(document.querySelectorAll('#main > .panel'), function (panel) {
    Array.prototype.forEach.call(panel.querySelectorAll('.tl-item'), function (li) {
      var keys = (li.getAttribute('data-tags') || '').split(' ');
      li.hidden = !!state.tag && keys.indexOf(state.tag) < 0;
    });
    Array.prototype.forEach.call(panel.querySelectorAll('.filter-btn'), function (b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-tag') === state.tag ? 'true' : 'false');
    });
  });
}

/* one listener for every filter on the sheet rather than one per button: the
   panels are rebuilt on a language switch, and listeners bound to them would be
   swept away with the markup they were bound to */
document.addEventListener('click', function (e) {
  var btn = e.target && e.target.closest ? e.target.closest('.filter-btn') : null;
  if (!btn) { return; }
  state.tag = btn.getAttribute('data-tag') || '';
  applyTagFilter();
});

/* ---------- section switching ---------- */
function highlightNav(navId) {
  Array.prototype.forEach.call(document.querySelectorAll('.nav a[data-nav]'), function (a) {
    if (a.getAttribute('data-nav') === navId) { a.setAttribute('aria-current', 'page'); }
    else { a.removeAttribute('aria-current'); }
  });
}

/* ---------- what is on screen ----------
   A change of sheet is a two-step move: the sheet on screen dims, and the
   incoming one is printed in its place. Two steps rather than a cross-dissolve
   because the panels sit in the normal flow (they are different heights, so they
   have to) and their words lie straight on the paper — fading one into the other
   would double-expose two sets of text. The two steps meet at --dip, where
   neither sheet is legible and neither is missing, so the handover is invisible
   and the whole move reads as one continuous dip rather than a blink.

   Three cases go straight to the last step, because none of them is a jump:
   the first paint; a language re-render, which rebuilds every panel and so
   leaves nothing on screen marked active; and a reader who has asked the system
   for less motion. The out duration is mirrored by .panel.is-leaving in the
   stylesheet — change both together. */
var LEAVE_MS = 120;
var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
var leaveTimer = null;    /* the handoff queued behind a sheet that is lifting off */
var pendingShow = null;   /* {sheet, write} waiting on that handoff */

function canAnimate() { return !reducedMotion.matches; }

function mainPanels() {
  return Array.prototype.slice.call(document.querySelectorAll('#main > .panel'));
}

/* the one sheet currently on screen, if any */
function sheetOnScreen() {
  var found = null;
  mainPanels().forEach(function (p) {
    if (p.classList.contains('is-active')) { found = p; }
  });
  return found;
}

/* whatever was lifting off is not going anywhere any more */
function forgetHandoff() {
  pendingShow = null;
  if (leaveTimer) { window.clearTimeout(leaveTimer); leaveTimer = null; }
}

/* put one sheet on screen and hide the rest, with no move at all */
function showOnly(sheet) {
  forgetHandoff();
  mainPanels().forEach(function (p) {
    p.classList.remove('is-leaving', 'is-entering');
    var on = (p === sheet);
    p.classList.toggle('is-active', on);
    p.hidden = !on;
  });
}

/* One place decides what is on screen, so a post and a panel cannot both show.
   `write`, when given, fills the sheet in — it is held back to the moment the
   sheet is printed, which is what makes one post to the next a real move even
   though both of them are the same element. */
function revealPanel(sheet, navId, write) {
  var onScreen = sheetOnScreen();
  highlightNav(navId);
  window.scrollTo(0, 0);

  /* the same element simply re-read (a language re-render of one post) is not a
     change of sheet either */
  if (!canAnimate() || !onScreen || (onScreen === sheet && !write)) {
    if (write) { write(); }
    showOnly(sheet);
    return;
  }

  /* a second click while the first sheet is still lifting off: re-aim, don't
     restart, so the outgoing sheet never flashes back to full ink */
  pendingShow = { sheet: sheet, write: write };
  if (onScreen.classList.contains('is-leaving')) { return; }

  onScreen.classList.remove('is-entering');
  onScreen.classList.add('is-leaving');
  onScreen.hidden = false;
  leaveTimer = window.setTimeout(land, LEAVE_MS);
}

/* the incoming sheet takes the ink */
function land() {
  leaveTimer = null;
  var job = pendingShow;
  pendingShow = null;
  /* the tree can be rebuilt underneath us (a language re-render) while we wait */
  if (!job || !job.sheet.parentNode) { return; }

  if (job.write) { job.write(); }

  mainPanels().forEach(function (p) {
    p.classList.remove('is-leaving');
    var on = (p === job.sheet);
    p.classList.toggle('is-active', on);
    p.hidden = !on;
  });

  void job.sheet.offsetWidth;             /* flush the display change … */
  job.sheet.classList.add('is-entering'); /* … so the ink rises from nothing */
}

/* The enter class takes itself off when its animation ends — one listener for
   the whole page, so its duration is never mirrored in the script too. */
document.addEventListener('animationend', function (e) {
  var t = e.target;
  if (t && t.classList && t.classList.contains('is-entering')) {
    t.classList.remove('is-entering');
  }
});

function showPanel(requested) {
  var panels = Array.prototype.slice.call(document.querySelectorAll('.panel'));
  if (!panels.some(function (p) { return p.id === requested; })) { requested = 'home'; }
  if (!document.getElementById(requested)) {
    requested = panels.length ? panels[0].id : '';
  }
  state.current = requested;
  revealPanel(document.getElementById(requested), requested);

  var current = (state.site.nav || []).filter(function (n) { return n.id === requested; })[0];
  document.title = current ? plain(current.title) : '';
}

/* A post is fetched the first time it is opened and then kept, so switching
   language re-renders from the cached file and stays instant. */
function showPost(slug) {
  state.current = 'post/' + slug;

  var nav = state.site.nav || [];
  var owner = postOwner(slug) || (nav[0] && nav[0].id) || 'home';

  var paint = function (post) {
    var main = document.getElementById('main');
    var section = document.getElementById('post-panel');
    if (!section) {
      section = document.createElement('section');
      section.className = 'panel';
      section.id = 'post-panel';
      main.appendChild(section);
    }
    var html = renderPost(post, owner);
    document.title = plain(post.title) + ' — ' + plain((state.profile || {}).name || '');
    /* the markup is handed over rather than pasted in: when this post replaces
       another in the very same element, the old words have to stay up until the
       sheet has lifted off */
    revealPanel(section, owner, function () { section.innerHTML = html; });
  };

  if (state.posts[slug]) { paint(state.posts[slug]); return; }
  loadJSON('data/posts/' + slug + '.json').then(function (post) {
    state.posts[slug] = post;
    /* the reader may have clicked away while this was in flight */
    if (state.current === 'post/' + slug) { paint(post); }
  }).catch(function (e) {
    fail('posts/' + slug + '.json', e.message);
  });
}

function routeFromHash() {
  return (location.hash || '').replace(/^#/, '');
}

function applyRoute(route) {
  var post = /^post\/(.+)$/.exec(route || '');
  if (post) { showPost(decodeURIComponent(post[1])); return; }
  showPanel(route);
}

function render() {
  renderRail();
  renderPanels();
  applyRoute(state.current || routeFromHash() || 'home');
}

/* ---------- start ---------- */
(function boot() {
  var savedLang = 'en';
  try {
    var saved = localStorage.getItem(STORE_KEY);
    if (saved) { savedLang = saved; }
  } catch (e) {}

  Promise.all([
    loadJSON('data/site.json').catch(function (e) { throw { path: 'site.json', reason: e.message }; }),
    loadJSON('data/profile.json').catch(function (e) { throw { path: 'profile.json', reason: e.message }; }),
    /* data/live.json is written by the scheduled job in .github/workflows.
       It may not exist yet (or the job may have failed) — never a reason to
       break the page, so a miss quietly becomes null and the page falls back. */
    loadJSON('data/live.json').catch(function () { return null; })
  ]).then(function (first) {
    state.site = first[0];
    state.profile = first[1];
    state.live = first[2];

    /* keep the remembered language only if the file still offers it */
    var codes = (state.site.languages || []).map(function (l) { return l.code; });
    state.lang = codes.indexOf(savedLang) >= 0 ? savedLang : (state.site.defaultLanguage || codes[0] || 'en');

    return Promise.all((state.site.nav || []).map(function (item) {
      var file = item.dataFile || (item.id + '.json');
      return loadJSON('data/' + file).catch(function (e) { throw { path: file, reason: e.message }; });
    }));
  }).then(function (panelData) {
    (state.site.nav || []).forEach(function (item, i) { state.panels[item.id] = panelData[i]; });
    render();
    window.addEventListener('hashchange', function () {
      applyRoute(routeFromHash());
    });
  }).catch(function (err) {
    fail(err && err.path, (err && err.reason) || 'unknown error');
  });
})();
</script>
</body>
</html>
